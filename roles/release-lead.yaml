# Файл Выпускающего. Правит только команда iwe-release-lead через запрос на слияние.
# Статусы, которые ставит Выпускающий: взято в N, отложено в N, возвращено из N.
releases:
  "0.42":
    snapshot_commit: null      # версия основной ветки шаблона в момент «режем»
    limit: null                # предел числа строк «взято в 0.42»
    required: []               # коды результатов, без которых выпуск не выходит
    taken: []                  # коды результатов: взято в 0.42
    deferred: []               # коды результатов: отложено в 0.42
    returned: []               # коды результатов: возвращено из 0.42
