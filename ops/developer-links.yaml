# Вид — по первому сработавшему правилу:
#   result_by_ref        SHA или номер PR из доказательства размещения результата (placement) стоит в тексте записи
#   no_rp                номера РП нет ни в тексте записи, ни в сообщении её коммита (commit_wp)
#   rp_no_board_results  номер РП есть, результатов этого РП на табло нет
#   result_by_reading    два слепых разметчика (участники пир-сессии claude-code и kimi-headless) независимо назвали один код из результатов РП записи
#   contested            разметчики разошлись; readings — их ответы (код, none или service)
#   service / none       оба разметчика: служебная правка / у РП нет единственного результата, который влечёт запись
# commit_wp — номер РП из сообщения коммита записи, когда в тексте записи его нет (записал агент по git log шаблона; программа его не перепроверяет).
