# Порядок сборки. Любой отказ команды — стоп, табло не пересобирается.
steps:
  - 'Подготовка: рабочие копии шести репозиториев выше рядом в одной папке IWE; python3 с pyyaml.'
  - 'В каждом репозитории: git fetch origin; ревизия = git rev-parse origin/main (записать в inputs).'
  - 'Новая пустая папка входов SRC; в неё для каждого входа с path: git -C <repo> show <revision>:<path> > SRC/<name>.'
  - 'FMT: git -C FMT rev-parse <revision> > SRC/fmt-sha; git -C FMT ls-tree -r --name-only <revision> > SRC/fmt-files.txt.'
  - 'Замер (около 4 минут): сразу перед ним canon-refresh.sh DS-my-strategy и DS-IT-systems/DS-ai-systems (иначе «позади origin» даёт complete: false); команда из produced_by; complete: false — не ошибка сборки, причина уйдёт на табло.'
  - 'shasum -a 256 SRC/* — записать в inputs.'
  - 'Сборка в чистую копию DS-iwe-releases: command из builder; код возврата 0, строка goals=… results=… совпадает с прошлой или расхождение объяснено входами.'
  - 'Проверка: вторая сборка из той же SRC в другую чистую копию; diff -r -x .git двух копий пустой.'
  - 'Проверка диффа к main: изменились только генерируемые файлы; каждое изменение кроме строк «Собрано …» и collected_at объясняется входами.'
  - 'Один запрос на слияние: этот файл и пересобранное табло; слияние без squash.'
