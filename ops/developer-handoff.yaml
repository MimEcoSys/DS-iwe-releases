# Из этого файла программа собирает releases/<release>/candidates.md. Поля «как проверить» и «как откатить»
# переносятся в записи CHANGELOG.md на ветке выпуска до первой сборки.
#   rollback_unit   слияние в основной ветке, которое добавило запись; записи с одним слиянием откатываются вместе
#   groups          слияния с несколькими записями: separable да|нет — можно ли снять одну запись без остальных
#   commits         коммиты правки от нового к старому; из них программа строит указание «как откатить»
#   off_switch      (необязательно) как выключить правку без отката
#   revert_first    (необязательно) записи, которые нужно откатить раньше этой, иначе откат конфликтует в коде
#   risk            высокий | средний | низкий, затем причина
#   recommendation  взять | отложить | решить Выпускающему, затем причина
#   depends_on      другие записи, с которыми правка делит файлы или от которых зависит
