# Порядок сборки табло и версии входов последней сборки (файл Разработчика, WP-529 Ф259).
# Ведёт Разработчик руками при каждой пересборке; build_board.py читает запись sbg.md,
# чтобы ссылаться на исходный документ только при совпадении SHA-256 входа.
# Запись описывает сборку, после которой страница NOW.md и board/ собраны в этом же коммите.
# Пересборка 16.11 (РП-529 Ф274, шаг 9): первая после выхода 0.42. Все входы собраны заново;
# не изменилась только STAGING.md. Табло: 605 результатов — 243 план, 212 в работе, 116 сделано,
# 34 отложено. Пункт 2: 201 на 2.1, 11 на 2.2, 0 на 2.3, 0 на 2.4. Вышедшее перешло в «Сделано»:
# 16 результатов 0.37–0.41.11 (бывший этап 2.3.1) и 10 результатов 0.42 (бывшие 2.3.2 и 2.4).
# Записи 0.42 — 110 (81 прежний кандидат и 29 исправлений ветки выпуска), невыпущенных — 14;
# 43 новые записи размечены черновиком агента как служебные, Разработчик уточняет связи.
# Замер Разработчика не приложен: канон DS-my-strategy был под заморозкой, canon-refresh не делали.
# Пересборка 18.11 (РП-529 Ф276, п.10): те же входы 16.11; убраны 865 ссылок на закрытый источник, остальное без изменений.
# Пересборка 18.11 (РП-529 Ф278): те же входы 16.11 плюс метки и история шаблона для страницы статистики board/stats.md;
# табло и страницы стадий не изменились, кроме ссылки на статистику. Программа переехала в tools/.

# Пересборка 18.11 (РП-529, после выхода 0.42): входы собраны заново на 18.11 (не изменились с 16.11 только метки шаблона и STAGING.md);
# табло 608 результатов — 244 план, 214 в работе, 116 сделано, 34 отложено; 16 новых записей шаблона размечены черновиком агента как служебные.

# Пересборка 20.11 (РП-529 Ф275, после выхода 0.42.1): все входы собраны заново на 20.11 (STAGING.md не изменился);
# табло 616 результатов — 252 план, 214 в работе, 116 сделано, 34 отложено; 8 новых результатов плана (Ц93-07, Ц123-01/02, Ц124-01…05).
# 30 записей 0.42.1 из Unreleased перенесены в released_0_42 (программа относит 0.42.x к одной группе); 32 новые записи
# 0.42.1 и 2 записи после выхода (#1622, #1624) размечены черновиком агента как служебные, Разработчик уточняет связи.
# decision_* — форма решений выпуска 0.42.1. Замер Разработчика не приложен (как 16.11).

# Пересборка 21.11 (РП-529 Ф275, Ф276, 0.42.1 вышла 20.11): те же входы 20.11 (хэши совпали), новая версия программы:
# у 0.42.1 свой диапазон, поэтому появились releases/0.N/0.42.1/shipped.md (63 записи) и board/released-0.42.1.md (0 результатов,
# все записи 0.42.1 служебные); «Вышло в 0.42» считает только 110 записей 0.42.0. Остальное табло не изменилось;
# повторная сборка в чистой копии совпала байт в байт. decision_* — форма решений 0.42.1 после этапа «После выхода».

# Пересборка 24.11 (РП-529, подготовка 0.42.2): все входы собраны заново на 24.11 (не изменились STAGING.md и метки шаблона).
# Передача Разработчика переключена на 0.42.2: 30 записей «Ещё не выпущено» (вершина шаблона 36bbe646), все взяты
# решением о составе 24.11 — появилась страница releases/0.N/0.42.2/candidates.md. 28 новых записей связаны по полю
# «Цель · Результат» записи (8 — с кодами Ц93-01/02/05/06, Ц82-02, Ц96-11, Ц96-13; 20 — служебные).
# Табло 625 результатов — 258 план, 216 в работе, 116 сделано, 35 отложено. Замер Разработчика не приложен (как 16.11).
# Повторная сборка в другой чистой копии совпала (кроме кэша Python). decision_* — форма решений 0.42.2 из этого же запроса.

# Пересборка 24.11, вторая (РП-529 Ф282): входы шаблона взяты с вершины 75cb2ff9 — после разметки FMT #1669 (31 запись,
# добавлена запись самой разметки U-d4adfc); остальные входы те же. Состав «откладываем три»: отложены U-9d0abc (#1633),
# U-a8d101 (#1662), U-802d20 (#1665), остальные 28 взяты. decision_* — форма решений 0.42.2 после этого решения.

# Пересборка 26.11 (РП-529, после выхода 0.42.2 25.11): все входы собраны заново на 26.11 с вершин основных веток; у STAGING.md тот же
# хэш при новой ревизии репозитория. Замер рабочих копий автора не приложен (как 16.11): входа нет, страница 2.2 табло так и пишет.
# У 0.42.2 свой диапазон в программе, поэтому появились releases/0.N/0.42.2/shipped.md (32 записи) и board/released-0.42.2.md.
# Развязка записей: 28 записей 0.42.2 перенесены из раздела links в released_0_42 файла связей без смены разметки, четыре записи ветки
# выпуска (#1672, #1673, #1671, слияние настроек) размечены служебными; 9 новых записей «Ещё не выпущено» после выхода (вершина
# шаблона a254425b) связаны по полю «Цель · Результат», #1681 служит Ц96-13 как #1633. Табло 631 результат: план 264, в работе 216,
# сделано 116, отложено 35 (разница с 24.11: шесть новых результатов плана Ц34-22, Ц34-23, Ц38-21, Ц38-22, Ц96-14, Ц96-15 из
# нового «Состояния по целям»). Форма решений 0.42.2 — как после этапа «После выхода» (дерево v0.42.2 = дерево rc.4).
# Повторная сборка из тех же входов в другой копии дерева совпала байт в байт (кроме кэша Python).

