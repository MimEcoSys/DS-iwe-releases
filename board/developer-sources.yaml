# чтобы ссылаться на исходный документ только при совпадении SHA-256 входа.
# Запись описывает сборку, после которой страница NOW.md и board/ собраны в этом же коммите.
# Пересборка 16.11 (РП-529 Ф274, шаг 9): первая после выхода 0.42. Все входы собраны заново;
# не изменилась только STAGING.md. Табло: 605 результатов — 243 план, 212 в работе, 116 сделано,
# 34 отложено. Пункт 2: 201 на 2.1, 11 на 2.2, 0 на 2.3, 0 на 2.4. Вышедшее перешло в «Сделано»:
# 16 результатов 0.37–0.41.11 (бывший этап 2.3.1) и 10 результатов 0.42 (бывшие 2.3.2 и 2.4).
# Записи 0.42 — 110 (81 прежний кандидат и 29 исправлений ветки выпуска), невыпущенных — 14;
# 43 новые записи размечены черновиком агента как служебные, Разработчик уточняет связи.
# Замер Разработчика не приложен: канон DS-my-strategy был под заморозкой, canon-refresh не делали.
# Пересборка 18.11 (РП-529 Ф276, п.10): те же входы 16.11; убраны 865 ссылок на закрытый источник, остальное без изменений.
# Пересборка 18.11 (РП-529 Ф278): те же входы 16.11 плюс метки и история шаблона для страницы статистики board/stats.md;
# табло и страницы стадий не изменились, кроме ссылки на статистику. Программа переехала в tools/.

