name: publication-gate
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Secrets scan (gitleaks)
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 git /repo --no-banner --redact
      - name: No e-mail addresses or phone numbers
        run: python3 ops/pii_scan.py
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Board builder tests
        run: python -m pip install --quiet pyyaml pytest && python -m pytest -q ops
      - name: Release decisions agree with candidates and the board snapshot
        run: python ops/check_decisions.py
      - name: User board matches its sources
        run: python ops/build_board.py --repo . --check-user-board
      - name: Public pages have no broken links
        run: python ops/build_board.py --repo . --check-links
      - name: Release tags in the catalog exist in the template
        run: |
          python - <<'PY'
          import subprocess, sys, yaml
          tags = [v["published_tag"] for v in yaml.safe_load(open("releases/index.yaml"))["versions"] if v.get("published_tag")]
          missing = [t for t in tags if not subprocess.run(
              ["git", "ls-remote", "--exit-code", "--tags", "https://github.com/TserenTserenov/FMT-exocortex-template.git", f"refs/tags/{t}"],
              capture_output=True).returncode == 0]
          sys.exit(f"tags missing in the template: {missing}" if missing else 0)
          PY
