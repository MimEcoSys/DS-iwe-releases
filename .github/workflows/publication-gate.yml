name: publication-gate
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Secrets scan (gitleaks)
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 git /repo --no-banner --redact
      - name: No e-mail addresses or phone numbers
        run: python3 ops/pii_scan.py
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Board builder tests
        run: python -m pip install --quiet pyyaml pytest && python -m pytest -q ops
      - name: User board matches its sources
        run: python ops/build_board.py --repo . --check-user-board
