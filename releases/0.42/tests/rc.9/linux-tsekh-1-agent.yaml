red_team:
  verdict: CAUTION
  accepted_by: ""
  checker: tsekh-1-agent (отдельный разговор Claude Code, Opus 5.5, без истории этой работы; запрос дословно из задания; 75 ходов, 16 мин; песочница bwrap с копией чистой установки rc.9; защитный фильтр не срабатывал)
  report: redteam-linux.md (атака не записала отчёт отдельным файлом; сохранён её итоговый ответ, полный журнал — logs/line13/)
  tree: ed064623b40c60804dfe92ff4c629163bb55ba64
  findings: >-
    Блокирующих нет. Н1 — ИЗВЕСТНАЯ (RT8-2): безопасное удаление на NixOS не находит rm, отказывает во всём, ничего не
    удаляет; с настоящим путём проходят все 37 случаев. Н2 — ИЗВЕСТНАЯ (пустые папки после возврата и разрешения для
    скрипта онбординга): после возврата на 0.41.11 остаются пустые папки двух навыков, один служебный файл и три
    разрешения на запуск скрипта, которого больше нет; новой лазейки атака не видит. Замечание: в rc.7 на моей
    установке эти разрешения после отката были убраны — расхождение сценариев, не перепроверял. Н3 — НОВАЯ (низкая):
    предпросмотр возврата пишет «можно ставить», оговорка про откат стоит рядом, но итог может сбить с толку. Н4 —
    ИЗВЕСТНЫЙ класс (RT8-4, права на запуск): обновление делает запускаемыми три программы, помеченные в хранилище
    обычными, права расходятся с чистой установкой; на работу не влияет. Н5 — ИЗВЕСТНАЯ (test-update-rc-channel.sh при
    входе в gh) и того же рода: два теста хранилища зависят от стандартных путей и отсутствия постороннего gh.
    Известные из задания — RT8-3 (лишняя строка «ОШИБКА») и чтение секретов — атака отдельно не записывала; повторный
    запуск меняет только служебные отметки времени (известно).
    Пройдены атакой: калибровка, версия кандидата, список выпуска (пересобран дважды, совпал), чистая установка,
    обновление 0.41.11 → rc.9 (878 файлов совпали с чистой установкой, пользовательские файлы целы), повтор, возврат без
    подтверждения (отказ, 0 изменений) и с подтверждением, цикл вперёд-назад-вперёд, права агента — 22 из 23 наборов
    тестов шаблона на исходниках и на обеих установленных копиях (23-й — Н1), тесты обновления и возврата (10/10 и
    192/192 без помех стенда), 33 задания CI.
    Не проверено атакой: macOS на этом коммите (задание macOS в запуске кандидата пропущено), запуск служб,
    подписи и происхождение сборки, сквозной тест хранилища 0.41.11 → кандидат (квота обращений к GitHub; путь пройден
    вживую). Рекомендация атаки: выпуск 0.42.0 — только после зелёной проверки на macOS при выпуске.
  note: "Ответ атаки сохранён вне временной папки сразу после завершения. Вызовов gh на запись нет, задач атака не заводила."
rt8_findings_closed:
  RT8-1: "закрыта: урезанная установка 0.41.11 после обновления до rc.9 не получает расписания (0 файлов, 0 вызовов systemctl), вывод называет причину и команду включения; на rc.8 — 2 файла и 2 вызова. Заведённое заранее расписание освежается; полный режим ставит, урезанный rc.9 — нет."
not_checked:
  - "Строки 3, 5-8, 11, 12, 14-17 — вне задания."
  - "Настоящий systemd в песочнице: systemctl и crontab подменены записью вызовов (так требует задание); фактическое включение таймера не проверялось."
  - "Полная установка с входом в gh и Claude: в окружении gh заменён запретом записи, поэтому полный режим — «насколько позволяет окружение» (создание хранилища отказывает, остальное проходит)."
  - "macOS и Windows — только задания на сервере."
