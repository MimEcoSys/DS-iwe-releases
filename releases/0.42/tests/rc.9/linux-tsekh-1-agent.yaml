build: 0.42-rc.9
platform: Linux (NixOS 25.05, tsekh-1), bash 5, systemd --user, cron отсутствует
environment: >-
  Как для rc.8: отдельный пользователь Linux iwe-test (uid 1001, свой systemd --user, без доступа к домашней папке
  рабочего пользователя); всё от rc.8 перенесено в ~/rc8-archive, установки rc.9 — с нуля. Развёртывание Цеха снова
  удалило пользователя до начала; сторож probes/ensure-user.sh завёл его заново в 10:33:37 (logs/user-guard.log) и
  работал всё время проверки. Конфигурацию Цеха не правил. Разговоры Claude Code и проверки RT8-1, RT5, F3 — в
  песочнице bwrap с копией установки iwe-test. Вместо gh — тестовая замена probes/gh-shim (запрет любой записи;
  «ERROR: gh repo create failed» в выводе установки ожидаем). Метка v0.42.0-rc.9 → коммит 267a281a1982, дерево
  ed064623b40c60804dfe92ff4c629163bb55ba64 (совпало с ожидаемым). Изменения rc.8 → rc.9: update.sh (12 строк),
  два теста, CHANGELOG, манифест. По правилу беседы команды-пробы в ответ не выписывались — запускались готовые файлы
  из probes/, в отчёте имя пробы, код и счёт. В журналах имя пользователя Цеха заменено на <user>.
preflight_rt8_1:
  verdict: закрыта
  probe: >-
    probes/rt8-1.sh — в песочнице без SETUP_CI ставит версию в выбранном режиме, по желанию заводит расписание
    извлечения знаний вручную, затем дважды обновляет по каналу rc, закреплённому на кандидате через заглушку API;
    systemctl и crontab подменены записью вызовов. Счёт — файлы extractor-git-diff-feed* в ~/.config/systemd/user,
    вызовы, строки вывода. Сводки — logs/rt8-1/summary-*.txt, полные выводы — logs/rt8-1/.
  a_core_0_41_11_to_candidate: >-
    rc.9 (код 0 оба запуска): файла режима нет; после первого обновления файлов службы 0, вызовов systemctl 0, crontab 1
    — это «crontab -l» (чтение списка, расписание не заводит; на rc.8 тот же вызов); в выводе «Экстрактор: расписания
    на этой установке нет, а режим установки не записан — расписание не заводим.» и «Включить: bash
    <IWE>/FMT-exocortex-template/scripts/setup-extractor-feeders.sh». Повторный запуск: файлов 0, systemctl 0, crontab 0,
    то же сообщение и команда включения. rc.8 (тот же сценарий, канал закреплён на rc.8): после первого обновления 2 файла
    службы, systemctl 2 (daemon-reload, enable --now extractor-git-diff-feed.timer), повтор — снова 2 вызова.
  b_core_with_manual_schedule: >-
    rc.9: 0.41.11 --core, затем bash scripts/setup-extractor-feeders.sh из папки шаблона 0.41.11 (код 0, 2 файла службы).
    Обновление до rc.9: 2 файла, тот же отпечаток содержимого, systemctl 2 (daemon-reload, enable --now) — расписание
    освежено, как раньше; повтор — то же.
  c_clean_rc9: >-
    Полный режим (setup.sh без --core, файл режима full): установка завела 2 файла службы; обновление по каналу rc —
    2 файла, systemctl 2 (освежение), повтор — то же. Урезанный (setup.sh --core, файл режима core): файлов 0,
    systemctl/crontab 0, «Экстрактор: установка в урезанном режиме (--core) — расписание не заводим.»; повтор — то же.
  d_builtin_tests: >-
    В чистом клоне метки v0.42.0-rc.9 (дерево сверено): scripts/tests/test-wp529-f270-core-mode-feeders.sh — код 0,
    PASS; scripts/tests/test-update-extractor-feeders.sh — код 0, «PASS: update.sh backfills the Extractor feeders
    (install, opt-out, no-CLI, missing script, failure, foreign workspace)». Замечание: в установленной папке шаблона
    первого теста нет (тесты шаблона не доставляются), второй там падает «feeders invoked with wrong mode or
    environment» — тест рассчитан на раскладку хранилища, не на установку. logs/suites/
