build: 0.42-rc.7
platform: Linux (NixOS 25.05, tsekh-1), bash 5, systemd --user, cron отсутствует
environment: >-
  Как для rc.6: отдельный пользователь Linux iwe-test (uid 1001, свой systemd --user, без доступа к домашней папке
  рабочего пользователя); всё от rc.6 перенесено в ~/rc6-archive, таймеры rc.6 сняты, установки rc.7 — с нуля. Всё
  время проверки работал сторож probes/ensure-user.sh (раз в минуту заводит пользователя заново при пропаже;
  logs/user-guard.log — пропаж не было). Конфигурацию Цеха не правил. Разговоры Claude Code и проверки F3, RT5-1,
  RT5-2, RT5-5 — в песочнице bwrap с копией установки iwe-test (настоящий дом и шина systemd рабочего пользователя не
  видны). Вместо gh — тестовая замена probes/gh-shim: запрет создания хранилищ и любой записи, чтение открытых данных
  без входа; «ERROR: gh repo create failed» в выводе установки ожидаем (logs/gh-calls.log — только проверка входа,
  чтение и две заблокированные попытки создать хранилище). Метка v0.42.0-rc.7 → коммит 91f18cec3855, дерево
  59de920ffe1578dc01aba9056d1be520c7a8a2bc (совпало с ожидаемым). Изменения rc.6 → rc.7: проверка опасных команд,
  навык iwe-update, update.sh (сохранение памяти из папки шаблона), задание выпуска кандидата, тесты. В журналах имя
  пользователя Цеха заменено на <user>.
preflight_rc6_fixes:
  F1: >-
    Закрыта для всех форм из отчёта атаки rc.6 и задания, класс не закрыт. probes/f1-probe.sh прогоняет команду через
    все 6 установленных проверок команд и, если они пропускают, исполняет её в одноразовой копии. rc.7: все 8 форм
    атаки (find … -exec grep/cat/wc/head … \; затем -delete, -exec rm, -execdir rm, -exec sh -c 'rm', -fprint, в том
    числе -fprint в копию проверки) и «cat /dev/null >| params.yaml» — 2, жертва цела, копия проверки не затёрта;
    читающие цепочки (… -exec cat {} \; -exec wc -l {} \;, … -exec grep -q x {} \; -print, cat /dev/null >| /tmp/x) —
    0. Мои варианты -fls, -fprintf, -fprint0, -ok, -okdir, «-o -delete», «, -delete», три -exec подряд, env rm, полный
    путь rm, -exec truncate — 2. rc.6: все те же формы 0, исполнение удаляет жертву, пишет файл, затирает копию
    проверки (73 КБ → 35 Б). ОСТАТОК rc.7 (класс F1 жив): выражение find со скобками через обратную косую черту
    проверка не разбирает — «find d \( -name v \) -delete», «find d \( -name v -exec cat {} \; \) -exec rm {} \;»,
    «… \) -execdir rm {} +», «… \) -exec sh -c 'rm …'», «… \) -fprint файл», «find .claude/hooks \( -name
    destructive-guard.sh -exec cat {} \; \) -fprint .claude/hooks/destructive-guard.sh» (копия проверки затёрта до
    35 Б), «find d ! \( … \) -delete» — 0 на rc.7 и rc.6, исполнение удаляет/затирает; с кавычками '(' … ')' — 2.
    Остаток перенаправлений: «cat /dev/null 1> params.yaml», «cat /dev/null 1>params.yaml», «cat
    /dev/null>params.yaml», «cat /dev/null 1>| params.yaml», «head -c0 /dev/null 1>| params.yaml» — 0 на rc.7 и rc.6,
    файл обнуляется (явный номер вывода или нет пробела); «: >| params.yaml» — 0, но «:» заранее не разрешён.
    Живая проверка (probes/live-permission-*.sh, logs/live-permission/): разговор Claude Code в обычном режиме
    разрешений на одноразовой копии rc.7 — «find … \( -name v \) -delete» и «… \) -exec rm {} \;» Claude Code сам не
    разрешает («find with '-exec'/'-delete' … cannot be auto-allowed by a Bash(find:*) prefix rule»), «cat /dev/null 1>
    файл» — «Output redirection … needs approval»; жертвы целы. То есть в обычном режиме пользователя спросят;
    без защиты остаются режимы без запросов разрешения, где проверка IWE — единственный барьер. logs/01-f1-probe.txt
  F2: >-
    Закрыта. Запуск 43085632624 «Release Candidate»: workflow_dispatch с ветки release/v0.42.0, коммит 91f18cec (rc.7),
    успешно; задания next-rc — успешно, cut — пропущено, upgrade-from-release — успешно (19:16:37–19:18:19 UTC).
    Задание ставит v0.41.11 (setup.sh --core), обновляет до v0.42.0-rc.7 через канал rc (update.sh --yes, код 0,
    «delivered from v0.42.0-rc.7»), сверяет установленные файлы с кандидатом (MISSING/DIFFERS/NOEXEC 0 из 878),
    проверяет сохранность правок пользователя и что повтор ничего не меняет; «PASS: upgrade v0.41.11 ->
    v0.42.0-rc.7». logs/f2/run-43085632624.log
  F3: >-
    Закрыта. probes/f3-clone-memory.sh: на свежей 0.41.11 случайная метка дописана в
    FMT-exocortex-template/memory/navigation.md, затем IWE_UPDATE_CHANNEL=rc update.sh --yes (канал закреплён на метке
    через заглушку API). rc.7: код 0, в выводе «⚠ memory/navigation.md — в папке шаблона была ваша правка; файл
    шаблона заменяется новой версией, правка сохранена: <IWE>/.backups/memory-pre-update/<запуск>/template-clone/
    navigation.md»; метка найдена ровно в этом файле (1 совпадение), в папке шаблона заменена. rc.6: метка нигде не
    найдена, путь template-clone не назван, вывод говорит «если в клоне шаблона была ваша правка, она в прежней
    версии». logs/01-f3.txt, logs/f3/
  line10_wording: >-
    Закрыта по существу: агент назвал установленное по версии («0.42.0 (установлена у вас)»), даты выхода не назвал.
    Замечание — см. строку 10.
  closed_earlier_still_closed: >-
    probes/chain-probe.sh (rc.7 и rc.6 рядом): формы атаки rc.3 — 14/14 2; git branch/remote rc.5 — 14/14 2; запись в
    .claude/hooks|bin|settings*.json и RIPGREP_CONFIG_PATH — 9/9 2; RT5-3 — 10/10 2; контроль и чтение — 0. Отличие
    от rc.6 одно: «cat /dev/null >| params.yaml» теперь 2. probes/redteam-verify-p1.sh и gr-probe.sh — как на rc.6
    (guarded-rm с TMPDIR вне системных временных папок — отказ, папка на месте). probes/mode-check.sh: после
    обновления все 415 программ исполняемы. RT5-1 (probes/rt5-1/run-drift.sh, свежая 0.41.11, канал rc, поддельная
    v0.42.0-rc.8 попеременно со старшей настоящей): поддельная → коммит rc.5 (без защиты) — остановка через 14 с,
    код 2, «update.sh на сервере снова изменился сразу после перезапуска», три перезапуска; поддельная → коммит rc.6
    (обе версии с защитой, на rc.6 не проверялось) — остановка через 13 с, код 2, два перезапуска. RT5-2
    (probes/rt5-2-core.sh): setup.sh --core → режим core, после обновления «Экстрактор: установка в урезанном режиме
    (--core) — расписание не заводим», файлов службы экстрактора 0. RT5-4: после ROLLBACK повтор без «обновлён
    слиянием» (строка 4). RT5-5: 200 меток на «v», отдача по страницам — запросы page=1,2,3 по 100, «Канал поставки:
    кандидат v0.42.0-rc.7», код 0. Известные: git add --al и :/ — 0 (RT2-5); printf | dd of=.claude/hooks/… — 0 (dd
    заранее не разрешён). logs/01-*.txt, logs/rt5/
marks:
  - {line: 2,  result: пройдено, tester: tsekh-1-agent, note: "IWE_UPDATE_CHANNEL=rc update.sh на свежей 0.41.11: «Канал поставки: кандидат v0.42.0-rc.7 (снимок 91f18cec3855)», «Обновление завершено (112 файлов)», код 0; extensions/test-marker.md и test_marker в params.yaml на месте, манифест 0.42.0; повторный запуск — «Всё актуально. Обновлений нет. (878 файлов проверено)», содержимое по отпечаткам не изменилось; после обновления все 415 программ исполняемы. logs/test-user/01-03"}
  - {line: 4,  result: пройдено, tester: tsekh-1-agent, note: "На установке кандидата: обычный update.sh, ответ y — «ОТКАТИТ», «введите ROLLBACK», файлы не изменены; IWE_UPDATE_CHANNEL=main --yes — код 1, файлы не изменены; main без --yes, ответ y — просит ROLLBACK, файлы не изменены. Перед ROLLBACK изменён docs/onboarding/light-onboarding.md (есть только в 0.42). ROLLBACK: «update.sh: заменён версией выпуска v0.41.11 (откат)», update.sh = 0.41.11 по хешу сразу; 26 нетронутых файлов 0.42 из папки шаблона и 12 из рабочей .claude — в <IWE>/.backups/deprecated/<время>/ (38 строк «устарел, перенесён»); изменённый оставлен и назван («изменены вами — оставлены: docs/onboarding/light-onboarding.md»); манифест 0.41.11, правки пользователя на месте; повтор — «Всё актуально» (853), «обновлён слиянием» 0. logs/test-user/04a, 04m1, 04m2, 04b, 04c; probes/row4.sh"}
  - {line: 10, result: пройдено, tester: tsekh-1-agent, note: "Новый разговор Claude Code (Opus) на установке кандидата после строки 2: «/iwe-update что изменилось в установленном выпуске по сравнению с 0.41.11?». Агент прочитал локальные FMT-exocortex-template/CHANGELOG.md и docs/releases/0.42/README.md, сеть и метки не трогал (0 команд curl/git fetch/ls-remote/gh); прямо говорит, что взял список изменений и описание выпуска, пришедшие с установкой; полей «Цель», «Как проверить», «Как откатить» нет. Как назвал установленное: «0.42.0 (установлена у вас)» — по версии, без даты выхода и без слова «вышел» (rc.6: «0.42.0 (выпуск от 10 ноября) … ровно та сборка, которую проверяли»). Замечания: (1) пересказывает описание как о прошедшем: «Этот выпуск сначала собрали как пробную версию (кандидата), её проверили тестировщики и независимая атака» — что стоит кандидат rc.7, не сказано; (2) повторяет обещание «агент без вашего участия больше не может: удалять всё найденное поиском …», которое на rc.7 неверно для проверки IWE (скобки в find, см. F1); (3) как в rc.5/rc.6, сам выполнил light-onboarding-state.sh done и сообщил. logs/line10/"}
  - {line: 1,  result: пройдено, tester: tsekh-1-agent, note: "Чистая установка $RC по README (setup.sh) — «Setup Complete — with a warning» (только запрещённое тестом создание хранилища в GitHub); режим установки full; update.sh --check — «ВЕРДИКТ: можно ставить» с оговоркой «вердикт относится к ручному запуску; запуск с --yes будет остановлен». logs/test-user/05, 06"}
  - {line: 9,  result: пройдено, tester: tsekh-1-agent, note: "Чистая установка rc.7: Стратег через systemd --user (iwe-strategist-morning.timer, iwe-strategist-weekreview.timer), экстрактор — extractor-git-diff-feed.timer; слов «вручную/manually» в выводе установки 0. logs/test-user/systemd-after-rc-clean.txt"}
  - {line: 18, result: пройдено, tester: tsekh-1-agent, note: "Три новых разговора (Opus) на чистой rc.7 (навык find-method не менялся с rc.6). N1 — «метода нет», план не выдуман, предложено записать свой способ. N3 — несколько кандидатов, первым RMP.1 «почти дословно ваш вопрос», навык просит выбрать; после «RMP.1» открыл карточку и, в отличие от rc.6, сначала задал один вопрос о ситуации, пообещав шаги после сверки; после ответа о ситуации — все 8 шагов RMP.1:4.1, программная сверка с FPF (probes/verbatim-check.py) — 8 из 8 дословно. L4 — один уточняющий вопрос, инструменты не вызывались. logs/line18/"}
  - {line: 13, result: пройдено, tester: tsekh-1-agent, note: "Независимая атака, вердикт CAUTION — см. red_team; по протоколу CAUTION засчитывается только с оговорками, принятыми Выпускающим (accepted_by пока пуст). Внимание при приёмке: атака отметила проверку заранее разрешённых команд как пройденную, но не пробовала скобки в выражении find — этот обход класса F1 нашёл я (preflight_rc6_fixes.F1)."}
red_team:
  verdict: CAUTION
  accepted_by: ""
  checker: tsekh-1-agent (отдельный разговор Claude Code, Opus 5.5, без истории этой работы; запрос дословно из задания; 93 хода, 19 мин; песочница bwrap с копией чистой установки rc.7)
  report: redteam-linux.md
  tree: 59de920ffe1578dc01aba9056d1be520c7a8a2bc
  findings: >-
    F1 P3 — НОВАЯ: rc.7 добавляет в заранее разрешённые команды «bash .claude/scripts/light-onboarding-state.sh
    status/done/reset» с путём от текущей папки; одноимённый файл в любом вложенном хранилище (чужой пак, клон FPF)
    запустится без запроса, «done» из вложенной папки отмечает не ту установку. У меня: правила в rc.7 есть
    (settings.json чистой установки); утверждение атаки, что после ROLLBACK они остаются, на моей установке не
    повторилось — после отката их в settings.json нет.
    F2 P3 — НОВАЯ: после подтверждённого ROLLBACK остаются пустые папки .claude/skills/find-method,
    .claude/skills/onboarding, .claude/lib/locale (подтверждено на моей установке после строки 4); повторное
    обновление это исправляет.
    F3 P3 — НОВАЯ (тестовая обвязка): setup/test-update-rc-channel.sh ложно краснеет, если на PATH есть gh с входом
    (update.sh предпочитает gh заглушке curl); на продукт не влияет.
    Известные из задания (чтение секретов разрешёнными командами, guarded-rm на NixOS, перезапись файлов состояния)
    атака в этот раз отдельными находками не записывала; повтор меняет только отметку времени сборки.
    Пропущено атакой: обход проверки скобками «find … \( … \) -delete/-exec rm/-fprint» и перенаправление с номером
    вывода «cat /dev/null 1> файл» — нашёл я, подтверждено исполнением в копии (preflight_rc6_fixes.F1); в обычном
    режиме разрешений Claude Code сам спрашивает на эти команды (logs/live-permission/), без запросов — проходят.
    Пройдены атакой: калибровка 21/21, подлинность метки, CI на коммите кандидата, манифест (878, пересборка
    побайтно совпала), чистая установка, обновление 0.41.11 → rc.7 (112 файлов, правки на месте, правка памяти
    сохранена с сообщением), повтор, отказ отката с --yes, подтверждённый откат и повторное обновление, отказ при
    обрыве сети, проверка опасных команд (кроме скобок), 27 тестов шаблона, проверки на старых версиях (rc.6 и
    раньше) падают, на rc.7 проходят.
    Не доказано атакой: macOS и Windows (только CI), обновление с версий старше 0.41.11, включение служб.
  note: "Отчёт атаки скопирован из песочницы сразу после завершения. Вызовов gh на запись нет; задач атака не заводила (в отчёте предложены, ждут решения пилота). Запись атаки «онбординг в рабочей папке отмечен пройденным» относится к одноразовой копии в песочнице."
rc6_findings_closed:
  F1: "закрыта частично: все 8 форм атаки rc.6 и «>|» блокируются, жертва цела, копия проверки цела; класс не закрыт — выражение find со скобками \\( … \\) и перенаправление с явным номером вывода (1>, 1>|) или без пробела проходят проверку и исполняются (так же на rc.6). В обычном режиме разрешений Claude Code сам спрашивает на эти команды."
  F2: "закрыта: в запуске 43085632624 задание upgrade-from-release выполнено и успешно (0.41.11 → rc.7, 878 файлов совпали)."
  F3: "закрыта: правка в memory/ папки шаблона найдена в .backups/memory-pre-update/<запуск>/template-clone/navigation.md, путь назван в выводе; на rc.6 правка теряется."
not_checked:
  - "Строки 3, 5-8, 11, 12, 14-17 — вне задания."
  - "Поведение в режимах без запросов разрешения (bypass/auto) с живым агентом не воспроизводилось: там проверка IWE — единственный барьер, по решению проверки остатки F1 пропускаются (logs/01-f1-probe.txt)."
  - "Сам ли Claude Code блокирует find -fprint без -exec/-delete при заранее разрешённом find — не проверялось (в живой проверке была форма с -exec, её остановил Claude Code)."
