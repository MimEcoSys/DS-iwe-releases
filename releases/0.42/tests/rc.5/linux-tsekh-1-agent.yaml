build: 0.42-rc.5
platform: Linux (NixOS 25.05, tsekh-1), bash 5, systemd --user, cron отсутствует
environment: >-
  Как для rc.4: отдельный пользователь Linux iwe-test (uid 1001, свой systemd --user, без доступа к домашней папке
  рабочего пользователя); всё от rc.4 перенесено в ~/rc4-archive, установки rc.5 — с нуля. Развёртывание Цеха снова
  удалило пользователя до начала; заведён заново в 17:37 тем же useradd с тем же uid + linger, всё время проверки
  работал сторож probes/ensure-user.sh (раз в минуту заводит заново при пропаже; logs/user-guard.log): сработал ещё раз в 18:02, после всех шагов на iwe-test, на результаты не повлияло. Конфигурацию
  Цеха не правил. Разговоры Claude Code — в песочнице bwrap с копией установки iwe-test (настоящий дом и шина systemd
  рабочего пользователя не видны). Вместо gh — тестовая замена probes/gh-shim: запрет создания хранилищ и любой
  записи, чтение открытых данных без входа; «ERROR: gh repo create failed» в выводе установки ожидаем. Метка
  v0.42.0-rc.5 → коммит 48dd21520fb5, дерево d5f8ecfc80fdc332373d848188152cb3cae058c8 (совпало с ожидаемым).
preflight_rc4_fixes:
  git_branch_remote: >-
    Закрыта. Через установленную цепочку из 6 проверок команд (probes/chain-probe.sh, с номером разговора в сообщении,
    как у Claude Code): git branch -d/-D/-f/-m/-M/-C и git remote add/rename/remove/rm/set-url/set-head/set-branches/prune
    — на rc.5 все 2 (блок — проверка опасных команд), на rc.4 все 0. git branch, git branch -a -vv, git branch new-x,
    git remote -v, git remote get-url origin — 0 на обоих. Мои варианты (git -C . branch -D, git -c … remote set-url,
    --delete, --force, set-url --push) — 2 на rc.5. logs/01-chain-probe.txt
  edge_forms_rc4: >-
    Закрыты. «RIPGREP_CONFIG_PATH=файл rg» (и через env, и через export) и «find … > .claude/hooks/destructive-guard.sh»
    — 2 на rc.5, 0 на rc.4. Запись перенаправлением и tee в .claude/hooks, .claude/bin, settings.json,
    settings.local.json (в том числе «>|», «1> ./…/../…», $HOME/IWE/…) — 2 на rc.5, 0 на rc.4. Для сведения: «printf x |
    dd of=.claude/hooks/destructive-guard.sh» проходит проверку на обоих, но dd агенту заранее не разрешён — Claude Code
    спросит разрешение. logs/01-chain-probe.txt
  rollback: >-
    Закрыта. На установке rc.5 после обновления с 0.41.11 до отката изменён один файл только из 0.42
    (docs/onboarding/light-onboarding.md). ROLLBACK: в выводе «update.sh: заменён версией выпуска v0.41.11 (откат)»;
    update.sh совпадает с 0.41.11 по хешу сразу, в том же запуске; остальные 25 файлов только из 0.42 из папки шаблона
    убраны в ~/IWE/.backups/deprecated/<время>/template/ (и 11 копий из рабочей .claude — в …/workspace/), каждый назван;
    изменённый файл остался с правкой и назван: «Файлы установленного выпуска, которых нет в 0.41.11, изменены вами —
    оставлены: docs/onboarding/light-onboarding.md»; правки пользователя (extensions/test-marker.md, params.yaml) на месте;
    манифест 0.41.11; повтор — «Всё актуально. (853)». Для сравнения: на rc.4 после отката оставалось 24 файла кандидата и
    update.sh кандидата. logs/test-user/04b-rollback-confirmed.log, 04c; probes/row4.sh
  iwe_update_skill: "Закрыта — см. строку 10."
  closed_earlier_still_closed: >-
    probes/chain-probe.sh: все 14 форм атаки rc.3 и мои формы rc.3 — 2 на rc.5 и rc.4; контроль (ls, find -exec grep/cat/
    cksum, rg) — 0. probes/redteam-verify-p1.sh: rm -rf, find -exec rm, find -exec env rm, find | xargs rm,
    git diff --output, find -fprint — 2 на обоих. probes/gr-probe.sh: guarded-rm с TMPDIR вне системных временных папок —
    отказ, папка на месте, внутри /tmp удаляет. probes/mode-check.sh: после обновления 0.41.11 → rc.5 все 414 программ
    (755 в метке) исполняемы, как и на чистой установке. git add --al и :/ — 0 (известная RT2-5).
    logs/01-chain-probe.txt, 01-verify-p1.txt, 01-guarded-rm-probe.txt, 01-modes.txt
marks:
  - {line: 2,  result: пройдено, tester: tsekh-1-agent, note: "IWE_UPDATE_CHANNEL=rc update.sh на свежей 0.41.11: «Канал поставки: кандидат v0.42.0-rc.5 (снимок 48dd21520fb5)», «Обновление завершено (111 файлов)», код 0; extensions/test-marker.md и test_marker в params.yaml на месте, манифест 0.42.0, появилось docs/releases/0.42/README.md; повторный запуск — «Всё актуально. Обновлений нет. (877 файлов проверено)», содержимое по отпечаткам не изменилось; права на запуск как в метке. logs/test-user/01-03"}
  - {line: 4,  result: пройдено, tester: tsekh-1-agent, note: "На установке кандидата: обычный update.sh, ответ y — «ОТКАТИТ», «введите ROLLBACK», файлы не изменены; IWE_UPDATE_CHANNEL=main --yes — код 1, файлы не изменены; main без --yes, ответ y — просит ROLLBACK, файлы не изменены. ROLLBACK — откат одним запуском: манифест 0.41.11, update.sh 0.41.11 сразу, файлы только из 0.42 в резервной копии, изменённый оставлен и назван, правки на месте; повтор — «Всё актуально» (853). Подробно — preflight_rc4_fixes.rollback. logs/test-user/04a, 04m1, 04m2, 04b, 04c"}
  - {line: 10, result: пройдено, tester: tsekh-1-agent, note: "Новый разговор Claude Code (Opus) на установке кандидата после строки 2: «/iwe-update что изменилось в установленном выпуске по сравнению с 0.41.11?». Агент прочитал локальный FMT-exocortex-template/CHANGELOG.md (совпадает с CHANGELOG метки v0.42.0-rc.5 по хешу, не с main) и docs/releases/0.42/README.md; метку v0.42.0 не искал, curl/git fetch не вызывал (0 таких команд); в ответе ссылается на оба файла и пересказывает «Известные ограничения» из описания выпуска. Объяснение верное (find-method, онбординг, iwe-notify, Linux/WSL2, строже проверка команд, ветки/адрес хранилища, откат с переносом файлов в резервную копию); полей «Цель», «Как проверить», «Как откатить» нет. Замечание: агент попутно выполнил light-onboarding-state.sh done и сообщил, что отметил лёгкий онбординг пройденным (с командой возврата). logs/line10/"}
  - {line: 1,  result: пройдено, tester: tsekh-1-agent, note: "Чистая установка $RC по README (setup.sh) — «Setup Complete — with a warning» (только запрещённое тестом создание хранилища в GitHub); update.sh --check — «ВЕРДИКТ: можно ставить» с оговоркой «вердикт относится к ручному запуску; запуск с --yes будет остановлен». logs/test-user/05, 06"}
  - {line: 9,  result: пройдено, tester: tsekh-1-agent, note: "Чистая установка rc.5: Стратег через systemd --user (iwe-strategist-morning.timer 04:00, iwe-strategist-weekreview.timer), экстрактор — extractor-git-diff-feed.timer; слов «вручную/manually» 0. Мелочи прежние (строка «Installing Strategist Agent launchd jobs...», «cron 09:00 + 21:00» в итоге экстрактора). logs/test-user/systemd-after-rc-clean.txt"}
  - {line: 18, result: пройдено, tester: tsekh-1-agent, note: "Три новых разговора (Opus) на чистой rc.5 (навык find-method не менялся с rc.4). N1 — «метода нет», план не выдуман (совпадения по culture показаны как не подходящие). N3 — RMP.1 вторым из трёх (первым GOALS.2 с пометкой «слова совпали, смысл другой»), навык просит выбрать; после «RMP.1» — применимость, ограничения и результат дословно и один вопрос о ситуации (шаг проверки границ навыка); после ответа — все 8 шагов RMP.1:4.1 английским текстом, русское пояснение после каждого; программная сверка с FPF (probes/verbatim-check.py) — 8 из 8 дословно. L4 — один уточняющий вопрос, инструменты не вызывались. logs/line18/"}
  - {line: 13, result: пройдено, tester: tsekh-1-agent, note: "Независимая атака, вердикт CAUTION — см. red_team; по протоколу CAUTION засчитывается только с оговорками, принятыми Выпускающим (accepted_by пока пуст)."}
red_team:
  verdict: CAUTION
  checker: tsekh-1-agent (отдельный разговор Claude Code, Opus 5.5, без истории этой работы; запрос дословно из задания; 82 хода, 29 мин; песочница bwrap с копией чистой установки rc.5)
  report: redteam-linux.md
  tree: d5f8ecfc80fdc332373d848188152cb3cae058c8
  accepted_by: ""   # протокол: CAUTION — только с оговорками, принятыми Выпускающим
  findings: >-
    P0/P1 нет; по словам атаки, ни одна находка не регрессия (RT5-1 и RT5-2 — код есть в 0.41.11).
    RT5-1 P2 — НОВАЯ: самообновление перечитывает канал при перезапуске update.sh; при «мерцающем» ответе GitHub
    (подставной ответ: то rc.5, то будто бы rc.6) update.sh перезапустил себя 401 раз за 240 с; update.sh заменяется
    до проверки манифеста, поэтому сбой после этого оставляет новый update.sh со старыми файлами (лечится повтором).
    Реалистичность низкая, данных не теряет.
    RT5-2 P2 — НОВАЯ: установка в режиме --core не ставит фоновый экстрактор, но первое же update.sh --yes ставит его
    таймер systemd и включает (режим --core не запоминается); включение атака не наблюдала (заблокировано в прогоне).
    RT5-3 P3 — НОВАЯ (класс прежних «разрешённые команды пишут»): проверка пропускает «cat /dev/null > …WeekPlan.md»,
    «head -c0 /dev/null > params.yaml», git remote update --prune, git branch --unset-upstream; опасно, только если
    Claude Code не спрашивает разрешения на перенаправление вывода (не проверено).
    RT5-4 P3 — НОВАЯ: после отката повторный запуск пишет «обновлён слиянием» для settings.json и делает копию при
    неизменном содержимом.
    RT5-5 P3 — НОВАЯ: канал rc читает одну страницу меток (откажет при ≥100 меток, сейчас 48); 6-7 анонимных запросов
    к GitHub на запуск при лимите 60 в час — при исчерпании отказ (безопасный).
    Известные: чтение секретов разрешёнными командами атака в этот раз не записывала (известное ограничение в
    docs/releases/0.42/README.md); CANNOT_VERIFY по проверкам шаблона на сервере — тот же класс, что rc.4 F3
    (проверка обновления на сервере не привязана к этому коммиту; обновить статус помешал лимит GitHub).
    Пройдены: калибровка 21/21, подлинность метки, целостность манифеста, чистая установка, обновление с 0.41.11
    (877/877, все программы исполняемы), повторный запуск, откат (0 из 26 файлов только из 0.42 осталось, всё в
    резервной копии), порча скачанного, 78 форм команд против установленной проверки, контроль: проверка rc.4 эти формы
    пропускает. CANNOT_VERIFY: macOS / bash 3.2; сохранность settings.local.json (запись метки атаке не дала её же защита).
  note: "Отчёт атаки скопирован из песочницы сразу после завершения. Вызовов gh на запись нет (только чтение); задачи агент не заводил («needs pilot»)."
rc4_findings_closed:
  git: "закрыта: git branch -d/-D/-f/-m/-M/-C и git remote add/rename/remove/rm/set-url/set-head/set-branches/prune — 2 на rc.5 (0 на rc.4), чтение и git branch new-x — 0."
  rollback: "закрыта: подтверждённый ROLLBACK в одном запуске ставит update.sh 0.41.11 и убирает нетронутые файлы 0.42 в .backups/deprecated, изменённый оставляет и называет."
  iwe_update_skill: "закрыта: на вопрос «что изменилось в установленном» агент читает локальный CHANGELOG.md и описание выпуска, метку не ищет."
  edge_forms: "закрыты обе мои пограничные формы rc.4 (RIPGREP_CONFIG_PATH и запись перенаправлением поверх проверки)."
not_checked:
  - "Строки 3, 5-8, 11, 12, 14-17 — вне задания."
  - "Запись через «printf x | dd of=.claude/hooks/…» проходит проверку команд; dd агенту заранее не разрешён, живой запрос разрешения Claude Code не воспроизводился."
