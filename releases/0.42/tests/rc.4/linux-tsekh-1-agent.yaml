  - "Запросит ли Claude Code разрешение на «RIPGREP_CONFIG_PATH=… rg» и «find … > файл» при разрешённых find:* и rg:* — живой запрос разрешения в этой проверке не воспроизводился."
  - "Атака не проверяла macOS/Windows (только по проверкам на сервере) и включение планировщика."
