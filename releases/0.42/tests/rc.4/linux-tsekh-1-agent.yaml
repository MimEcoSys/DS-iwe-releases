build: 0.42-rc.4
platform: Linux (NixOS 25.05, tsekh-1), bash 5, systemd --user, cron отсутствует
environment: >-
  Как для rc.3: отдельный пользователь Linux iwe-test (uid 1001, свой systemd --user, без доступа к домашней папке
  рабочего пользователя); всё от rc.3 перенесено в ~/rc3-archive, установки rc.4 — с нуля. Развёртывание Цеха снова
  удалило пользователя до начала; заведён заново в 14:02 тем же useradd с тем же uid + linger, всё время проверки
  работал сторож ensure-user.sh (раз в минуту заводит заново при пропаже; logs/user-guard.log): сработал ещё раз в
  14:41, после всех шагов на iwe-test, на результаты не повлияло. Конфигурацию Цеха не правил. Разговоры Claude Code — в песочнице bwrap с копией установки iwe-test (настоящий дом и шина systemd рабочего
  пользователя не видны). Вместо gh — тестовая замена: запрет создания хранилищ и любой записи, чтение открытых данных
  без входа; «ERROR: gh repo create failed» в выводе установки ожидаем. Журналы: logs/.
preflight_rc3_fixes:
  F1: >-
    Закрыта. После обновления 0.41.11 → rc.4 все 413 файлов манифеста с режимом 100755 в метке исполняемы, у четырёх
    файлов находки 755 (mode-check.sh; на обновлённой rc.3 — 4 без права, на чистой rc.3 — 0). Вызов уведомления, как в
    отчёте атаки rc.3 (notify.sh --require-delivery capabilities regress, IWE_TG_BIN = заглушка шлюза): обновлённая
    rc.4 — заглушка вызвана 1 раз, «outcome=deferred»; чистая rc.4 — так же; обновлённая rc.3 — «Telegram send FAILED …
    iwe-notify not found», заглушка 0 раз; чистая rc.3 — вызвана. logs/01-F1-modes.txt, logs/01-F1-notify-stub.txt
  F2: >-
    Закрыта по всем формам из отчёта rc.3. Через установленную цепочку из 6 проверок команд (chain-probe.sh, с номером
    разговора в сообщении, как у Claude Code): find -exec sh -c / bash -c / chrt rm / truncate / cp /dev/null / mv /
    sed -i / sort -o / tee / python3 / ln -sf и rg --pre, rg --pre= — на rc.4 все 2 (блок — проверка опасных команд), на
    rc.3 все 0. Контроль: ls, find -exec grep, find -exec cat, find -exec cksum, обычный rg — 0 на обоих. Ещё
    блокируются find -exec rg --pre, -execdir rm, -ok rm, цепочка -exec cat … -exec sh -c. Для сведения, не
    подтверждено как уязвимость: проходят «RIPGREP_CONFIG_PATH=файл rg …» (файл настроек rg может содержать --pre) и
    «find … -exec echo x \; > .claude/hooks/destructive-guard.sh» (перенаправление вывода поверх проверки); опасны ли
    они, зависит от того, запросит ли Claude Code разрешение при переменной окружения и перенаправлении — это я не
    проверял, атака их не записала. logs/01-F2-chain-probe.txt
  closed_in_rc3_still_closed: >-
    redteam-verify-p1.sh на rc.4 и rc.3: rm -rf, find -exec rm, find -exec env rm, find | xargs rm, git diff --output,
    find -fprint — 2 на обоих; gr-probe.sh: guarded-rm с TMPDIR вне системных временных папок — отказ, папка на месте,
    внутри /tmp удаляет. git add --al и :/ — 0 (известная RT2-5). logs/01-verify-p1.txt, logs/01-guarded-rm-probe.txt
marks:
  - {line: 2,  result: пройдено, tester: tsekh-1-agent, note: "IWE_UPDATE_CHANNEL=rc update.sh на свежей 0.41.11: «Канал поставки: кандидат v0.42.0-rc.4 (снимок 5f1277bea5c6)», 109 файлов, код 0; extensions/test-marker.md и test_marker в params.yaml на месте, манифест 0.42.0; повторный запуск — «Всё актуально. Обновлений нет. (875 файлов проверено)», содержимое по отпечаткам не изменилось; права на запуск совпадают с меткой (см. preflight F1). logs/test-user/01-03"}
  - {line: 4,  result: пройдено, tester: tsekh-1-agent, note: "На установке кандидата: обычный update.sh, ответ y — «ОТКАТИТ», «Это ОТКАТ… введите ROLLBACK», «Отменено», файлы не изменены; IWE_UPDATE_CHANNEL=main --yes — «Остановлено: обнаружен откат…», код 1, файлы не изменены; main без --yes, ответ y — просит ROLLBACK, файлы не изменены. После ROLLBACK — манифест 0.41.11 (85 файлов), правки на месте; повтор — «Всё актуально» (853), update.sh становится 0.41.11 только на повторе (известно, атака F4). logs/test-user/04a, 04m1, 04m2, 04b, 04c"}
  - {line: 10, result: пройдено, tester: tsekh-1-agent, note: "Новый разговор Claude Code (Opus) на установке кандидата после строки 2: «/iwe-update что изменилось в установленном выпуске по сравнению с 0.41.11?». Объяснение 0.42 верное (find-method, онбординг, уведомления, откат на любом канале, строже проверка find -exec), полей «Цель», «Как проверить», «Как откатить» нет, main не читал. Источник: агент сначала попробовал несуществующую метку v0.42.0 (по версии манифеста), получил «не найдено» и прочитал CHANGELOG.md из папки шаблона, честно сказав об этом; этот файл совпадает с CHANGELOG метки v0.42.0-rc.4 (сверено хешем), не с main. Замечание к навыку iwe-update: он пишет «CHANGELOG.md больше не доставляется локально», а файл есть в манифесте и доставляется; для вопроса «что изменилось в установленном» правила, откуда читать, в навыке нет — отсюда попытка несуществующей метки. logs/line10/"}
  - {line: 1,  result: пройдено, tester: tsekh-1-agent, note: "Чистая установка $RC по README (setup.sh) — «Setup Complete — with a warning» (только запрещённое тестом создание хранилища в GitHub); update.sh --check — «ВЕРДИКТ: можно ставить» с оговоркой «вердикт относится к ручному запуску; запуск с --yes будет остановлен». logs/test-user/05, 06"}
  - {line: 9,  result: пройдено, tester: tsekh-1-agent, note: "Чистая установка rc.4: Стратег через systemd --user (iwe-strategist-morning.timer 04:00, iwe-strategist-weekreview.timer), экстрактор — extractor-git-diff-feed.timer; слов «вручную/manually» 0. Мелочи прежние (строка про launchd, «cron 09:00 + 21:00» в итоге экстрактора). logs/test-user/systemd-after-rc-clean.txt"}
  - {line: 18, result: пройдено, tester: tsekh-1-agent, note: "Три новых разговора (Opus) на чистой rc.4 (навык find-method не менялся с rc.3). N1 — «метода нет», план не выдуман (совпадения по culture показаны как не подходящие по смыслу). N3 — RMP.1 первым из трёх, навык просит выбрать; после «RMP.1» агент привёл применимость и ограничения дословно и по шагу 5 навыка («проверка границ») задал один вопрос о ситуации; после ответа — все 8 шагов RMP.1:4.1 английским текстом, русское пояснение после каждого; сверка с FPF/DPFs/RESEARCH-METHOD-PRACTICE-PRINCIPLES-FRAMEWORK.md — 8 из 8 дословно (шаг 7 со вложенным списком сверен глазами, программа спотыкалась о маркеры цитаты). Замечание: в rc.3 шаги шли сразу после выбора, здесь — после одного вопроса о границах; навык это допускает. L4 — один уточняющий вопрос, инструменты не вызывались. logs/line18/"}
red_team:
  verdict: CAUTION
  checker: tsekh-1-agent (отдельный разговор Claude Code, Opus 5.5, без истории этой работы; запрос дословно из задания; 79 ходов, 18 мин)
  report: redteam-linux.md
  tree: f8f92838627461c80cdaeb1bab5b6805754800fc
  accepted_by: ""   # протокол: CAUTION — только с оговорками, принятыми Выпускающим
  findings: >-
    P0/P1 нет; все четыре находки, по словам атаки, есть и в 0.41.11 (не регрессии).
    F1 P2 — ИЗВЕСТНАЯ (RT2-6): чтение секретов через cat .e*, printenv, git show HEAD:.env, cp .env, python open.
    F2 P2 — НОВАЯ (класс RT2-3/RT2-8, другие команды): заранее разрешённые git branch и git remote — проверка пропускает
    git branch -D/-f и git remote set-url/remove/add (удаление ветки, подмена адреса хранилища без запроса;
    восстановимо через reflog).
    F3 P2 — НОВАЯ (проверки шаблона): проверка обновления на сервере берёт «предыдущим» внутренний коммит кандидата и
    не запускает update.sh; путь 0.41.11 → кандидат проверен только вручную.
    F4 P3 — ИЗВЕСТНАЯ (rc.3 F5 + строка 4): после ROLLBACK остаётся update.sh кандидата до следующего запуска и
    24 файла только из 0.42.
    Пройдены: калибровка 21/21, подлинность метки, целостность манифеста, чистая установка, обновление (875/875,
    права и файлы как у чистой), повторный запуск, защита от отката, порча скачанных файлов (обновление остановлено,
    восстановление проходит), 475/475 проверок команд на установленной копии, контроль: старая проверка 0.41.11
    проваливает 42 новых случая. CANNOT_VERIFY: macOS/Windows (только по зелёным проверкам на сервере), включение
    планировщика (намеренно заблокировано в одноразовом прогоне).
  note: "Отчёт атаки скопирован из песочницы сразу после завершения. Задачи в хранилище агент не заводил (gh-заглушка запрещает). Мои две пограничные формы (RIPGREP_CONFIG_PATH, перенаправление вывода find поверх проверки) атака не записывала — см. preflight F2."
rc3_p1_findings_closed:
  F1: "закрыта: права на запуск после обновления как в метке, уведомление доходит до шлюза, как на чистой установке."
  F2: "закрыта для всех форм из отчёта rc.3; две мои пограничные формы — для сведения, не подтверждены как уязвимость."
not_checked:
