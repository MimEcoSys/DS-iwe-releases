  - {line: 2,  result: пройдено, tester: tsekh-1-agent, note: "IWE_UPDATE_CHANNEL=rc update.sh на свежей 0.41.11: «Канал поставки: кандидат v0.42.0-rc.6 (снимок 557ecb21bbf3)», «Обновление завершено (111 файлов)», код 0; extensions/test-marker.md и test_marker в params.yaml на месте, манифест 0.42.0; повторный запуск — «Всё актуально. Обновлений нет. (877 файлов проверено)», содержимое по отпечаткам не изменилось; права на запуск как в метке. logs/test-user/01-03"}
  - {line: 4,  result: пройдено, tester: tsekh-1-agent, note: "На установке кандидата: обычный update.sh, ответ y — «ОТКАТИТ», «введите ROLLBACK», файлы не изменены; IWE_UPDATE_CHANNEL=main --yes — код 1, файлы не изменены; main без --yes, ответ y — просит ROLLBACK, файлы не изменены. Перед ROLLBACK изменён docs/onboarding/light-onboarding.md (есть только в 0.42). ROLLBACK: «update.sh: заменён версией выпуска v0.41.11 (откат)», update.sh = 0.41.11 по хешу сразу; 25 нетронутых файлов 0.42 из папки шаблона и 11 из рабочей .claude — в .backups/deprecated/<время>/; изменённый оставлен и назван; манифест 0.41.11, правки пользователя на месте; повтор — «Всё актуально» (853), без «обновлён слиянием». logs/test-user/04a, 04m1, 04m2, 04b, 04c; probes/row4.sh"}
  - {line: 10, result: пройдено, tester: tsekh-1-agent, note: "Новый разговор Claude Code (Opus) на установке кандидата после строки 2: «/iwe-update что изменилось в установленном выпуске по сравнению с 0.41.11?». Агент прочитал локальный FMT-exocortex-template/CHANGELOG.md (совпадает с CHANGELOG метки v0.42.0-rc.6 по хешу) и docs/releases/0.42/README.md; метку v0.42.0 не искал, curl/git fetch не вызывал (0 таких команд); в ответе прямо говорит, что взял список изменений и описание выпуска, пришедшие с обновлением. Объяснение верное, полей «Цель», «Как проверить», «Как откатить» нет. Замечания: (1) агент пишет «у вас уже стоит 0.42.0 (выпуск от 10 ноября) … вы получили ровно ту сборку, которую проверяли тестировщики», хотя стоит кандидат rc.6 — пересказал описание выпуска как вышедшего; (2) как в rc.5, сам выполнил light-onboarding-state.sh done и сообщил об этом. logs/line10/"}
  - {line: 1,  result: пройдено, tester: tsekh-1-agent, note: "Чистая установка $RC по README (setup.sh) — «Setup Complete — with a warning» (только запрещённое тестом создание хранилища в GitHub); режим установки full; update.sh --check — «ВЕРДИКТ: можно ставить» с оговоркой «вердикт относится к ручному запуску; запуск с --yes будет остановлен». logs/test-user/05, 06"}
  - {line: 9,  result: пройдено, tester: tsekh-1-agent, note: "Чистая установка rc.6: Стратег через systemd --user (iwe-strategist-morning.timer, iwe-strategist-weekreview.timer), экстрактор — extractor-git-diff-feed.timer; слов «вручную/manually» 0. Мелочи прежние (строка про launchd, «cron 09:00 + 21:00» в итоге экстрактора). logs/test-user/systemd-after-rc-clean.txt"}
  - {line: 18, result: пройдено, tester: tsekh-1-agent, note: "Три новых разговора (Opus) на чистой rc.6 (навык find-method не менялся с rc.5). N1 — «метода нет», план не выдуман, предложено записать свой способ карточкой метода. N3 — несколько кандидатов, по смыслу ближе всего RMP.1, навык просит выбрать; после «RMP.1» — все 8 шагов RMP.1:4.1 английским текстом с русским пояснением сразу, затем вопросы о ситуации (кто получатель, для чего, кто решает); программная сверка с FPF (probes/verbatim-check.py) — 8 из 8 дословно. L4 — один уточняющий вопрос, инструменты не вызывались. logs/line18/"}
  - {line: 13, result: не пройдено, tester: tsekh-1-agent, note: "Независимая атака, вердикт BLOCKED: F1 P1 — обход проверки опасных команд цепочкой find (подтверждено мной). См. red_team."}
red_team:
  verdict: BLOCKED
  checker: tsekh-1-agent (отдельный разговор Claude Code, Opus 5.5, без истории этой работы; запрос дословно из задания; 65 ходов, 18 мин; песочница bwrap с копией чистой установки rc.6)
  report: redteam-linux.md
  tree: 3a25f88bc801dc7f6b07317f22c144bf8368b415
  findings: >-
    F1 P1 — НОВАЯ (тот же класс, что RT2-1 и rc.3 F2, новая форма; не регрессия — проходит и на rc.5, и, по атаке,
    на 0.41.11): после первого читающего действия find, завершённого «\;» (-exec cat/grep/wc/head … \;), проверка
    не смотрит остальные действия выражения: find … -exec cat {} \; -delete, … -exec cat {} \; -exec rm {} \;,
    … -execdir cat {} \; -exec rm {} \;, … -exec wc -l {} \; -exec sh -c 'rm "$0"' {} \;, … -exec head -1 {} \;
    -execdir rm {} +, … -exec cat {} \; -fprint файл, в том числе -fprint .claude/hooks/destructive-guard.sh (атака
    затёрла копию проверки 73 КБ → 35 Б). find заранее разрешён агенту — запроса не будет. Подтверждено мной на
    установленной цепочке из 6 проверок: все 8 форм — 0 на rc.6 и на rc.5; контроль find -delete и -exec cat {} +
    -delete — 2. logs/13-own-f1-probe.txt, probes/f1-probe.sh. Мои прежние пробы этого не ловили: в них после
    чтения шло «sh -c 'rm -rf …'», которое ловится по другому признаку.
    F2 P2 — ИЗВЕСТНЫЙ класс (rc.4 F3: проверка обновления на сервере не проверяет путь с 0.41.11), уточнена причина:
    задание upgrade-from-release описано только в ветке выпуска, а запуск идёт по описанию из main, поэтому для rc.5 и
    rc.6 оно не выполнялось ни разу (запуск 43068628486 — только next-rc и cut). Атака восполнила вручную: обновление
    0.41.11 → rc.6 проходит.
    F3 P2 — НОВАЯ (по атаке, давняя, #965/#967): правка, сделанная прямо в memory/ папки шаблона, при обновлении
    пропадает, а вывод update.sh говорит, что прежняя версия сохранена в .backups/memory-pre-update (там копия из
    рабочей папки, не правка из шаблона). Правку в папке шаблона документация не советует; ложно сообщение.
    F4 P3 — ИЗВЕСТНАЯ (была и в 0.41.11; в моих пробах с rc.3 обходится заменой пути): guarded-rm ищет rm только в
    /usr/bin/rm и /bin/rm, на NixOS их нет — безопасное удаление отказывает всегда (безопасный отказ).
    F5 P3 — НОВАЯ: повторный setup.sh --core меняет .iwe-runtime/.build-hash, повторное обновление переписывает 16
    файлов состояния — только шум.
    Чтение секретов разрешёнными командами (известное ограничение в docs/releases/0.42/README.md) атака в этот раз не
    записывала.
    Пройдены: калибровка 21/21, подлинность метки, чистая установка (--core, режим core), обновление 0.41.11 → rc.6
    (877 файлов, правки на месте, повтор без изменений), откат (отказ с --yes, ROLLBACK: 26/26 файлов 0.42 убраны,
    37 в резервной копии), 18/18 проверок из шаблона на установленной копии, 475/475 случаев проверки команд.
    CANNOT_VERIFY: включение служб и планировщика (запрещено в прогоне), macOS / Windows (только зелёные задания CI).
  note: "Отчёт атаки скопирован из песочницы сразу после завершения. Вызовов gh на запись нет; задачи агент не заводил (черновики четырёх задач — в конце отчёта, завести может только пилот)."
rt5_findings_closed:
  RT5-1: "закрыта: цикл перезапусков останавливается с кодом 2 и обещанным сообщением (8 с вместо бесконечного цикла на rc.5); замечание — до остановки три перезапуска, потому что отметку ставит только update.sh rc.6."
  RT5-2: "закрыта: после setup.sh --core обновление не ставит расписание экстрактора и пишет об урезанном режиме."
  RT5-3: "закрыта для всех форм из отчёта атаки и задания; остаток для сведения — «cat /dev/null >| файл» проходит."
  RT5-4: "закрыта: после отката повтор без «обновлён слиянием»."
  RT5-5: "закрыта: канал rc читает метки по страницам и находит кандидата при 199 метках; rc.5 в той же обстановке отказывает."
not_checked:
  - "Строки 3, 5-8, 11, 12, 14-17 — вне задания."
  - "Спросит ли Claude Code разрешение на «cat /dev/null >| файл» при заранее разрешённом cat — живой запрос разрешения не воспроизводился."
  - "RT5-1 с двумя версиями, обе с новой защитой (rc.6 и более новая), воспроизвести нельзя: второй такой метки нет; проверен вариант с поддельной меткой на rc.5."
