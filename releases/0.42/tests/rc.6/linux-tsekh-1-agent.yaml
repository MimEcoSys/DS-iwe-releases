build: 0.42-rc.6
platform: Linux (NixOS 25.05, tsekh-1), bash 5, systemd --user, cron отсутствует
environment: >-
  Как для rc.5: отдельный пользователь Linux iwe-test (uid 1001, свой systemd --user, без доступа к домашней папке
  рабочего пользователя); всё от rc.5 перенесено в ~/rc5-archive, установки rc.6 — с нуля. Развёртывание Цеха снова
  удалило пользователя до начала; заведён заново в 19:43 тем же useradd с тем же uid + linger, всё время проверки
  работал сторож probes/ensure-user.sh (раз в минуту заводит заново при пропаже; logs/user-guard.log). Конфигурацию
  Цеха не правил. Разговоры Claude Code и проверки RT5-1/RT5-2/RT5-5 — в песочнице bwrap с копией установки iwe-test
  (настоящий дом и шина systemd рабочего пользователя не видны). Вместо gh — тестовая замена probes/gh-shim: запрет
  создания хранилищ и любой записи, чтение открытых данных без входа; «ERROR: gh repo create failed» в выводе установки
  ожидаем. Метка v0.42.0-rc.6 → коммит 557ecb21bbf3, дерево 3a25f88bc801dc7f6b07317f22c144bf8368b415 (совпало с
  ожидаемым). В журналах имя пользователя Цеха заменено на <user>.
preflight_rt5_fixes:
  RT5-1: >-
    Закрыта, с замечанием. Повтор сценария атаки rc.5 (probes/rt5-1/: копия её заглушки API с настраиваемой подменной
    меткой; run-drift.sh): свежая 0.41.11, update.sh --yes по каналу rc, список меток попеременно с настоящей
    старшей меткой и поддельной более новой, указывающей на старый коммит. rc.6 (rc.6 ↔ поддельная rc.7 = коммит rc.5):
    остановка через 8 с, код 2, «ОШИБКА: update.sh на сервере снова изменился сразу после перезапуска — версия меняется
    прямо сейчас», «Обновление остановлено, файлы не тронуты», 4 запроса списка меток. rc.5 (rc.5 ↔ поддельная rc.6 =
    коммит rc.4, как у атаки): цикл 391 перезапуск за 240 с, остановлен моим таймером. Замечание: до остановки rc.6 было
    три перезапуска, а не один — отметку о перезапуске ставит только update.sh rc.6 при своём перезапуске; первый
    перезапуск сделал update.sh 0.41.11 (отметки не ставит), второй — rc.6, третий — update.sh rc.5 из поддельной метки
    (без защиты), после чего rc.6 увидела отметку и остановилась. Цикл ограничен; сам rc.6 перезапускается один раз.
    Лишняя строка «ОШИБКА: update.sh прервался на строке 1: exit "$EXIT_NETWORK"» после остановки (тот же род, что rc.3 F4).
    logs/rt5/rt5-1-*.log
  RT5-2: >-
    Закрыта. setup.sh --core, затем IWE_UPDATE_CHANNEL=rc update.sh --yes (probes/rt5-2-core.sh). rc.6:
    <IWE>/.iwe-install-mode = core; в выводе обновления «Экстрактор: установка в урезанном режиме (--core) — расписание
    не заводим»; файлов extractor-git-diff-feed в ~/.config/systemd/user нет. rc.5 (канал rc закреплён на rc.5 через
    заглушку API без подмены): после обновления появились extractor-git-diff-feed.service и .timer. Обычная установка
    rc.6 пишет режим full. logs/rt5/rt5-2-*.log
  RT5-3: >-
    Закрыта. Через установленную цепочку из 6 проверок команд (probes/chain-probe.sh): cat /dev/null > WeekPlan.md,
    head -c0 /dev/null > params.yaml, cat /dev/null > ~/IWE/memory/MEMORY.md, head -c 0 params.yaml > params.yaml,
    git remote update --prune / -p, git branch --unset-upstream / -u / --set-upstream-to= / --set-upstream-to — на rc.6
    все 2, на rc.5 все 0. cat params.yaml, head -n 20, cat /dev/null > /tmp/x, git remote update — 0 на обоих. Мои
    варианты: tail -c0 /dev/null > файл и cat < /dev/null > файл — 2 на rc.6. Остаток: «cat /dev/null >| params.yaml»
    (перенаправление с >|) — 0 на rc.6, а cat агенту разрешён заранее; опасно в том же условии, что исходная RT5-3
    (если Claude Code не спросит разрешение на перенаправление — не проверялось). Проходят также «: > файл»,
    «> файл», «true > файл», git branch --track/--no-track, но эти команды заранее не разрешены. logs/01-chain-probe.txt
  RT5-4: >-
    Закрыта. После подтверждённого ROLLBACK повторный обычный update.sh: строк «обновлён слиянием» 0, «Всё актуально.
    (853)». logs/test-user/04c-after-rollback-rerun.log
  RT5-5: >-
    Закрыта. Заглушка API с отдачей по страницам (RT_PAGINATE=1, как у GitHub) и 150 дополнительными поддельными
    метками (199 меток на «v»): rc.6 — запросы page=1 и page=2 по 100, «Канал поставки: кандидат v0.42.0-rc.6», код 0;
    rc.5 — один запрос без страниц, «ОШИБКА: … список тегов не поместился в один ответ API», код 2.
    logs/rt5/rt5-5-*.log
  closed_earlier_still_closed: >-
    probes/chain-probe.sh: формы атаки rc.3, git branch/remote rc.5, запись в .claude/hooks|bin|settings*.json,
    RIPGREP_CONFIG_PATH — 2 на rc.6 и rc.5; контроль — 0. probes/redteam-verify-p1.sh: rm -rf, find -exec rm,
    find -exec env rm, find | xargs rm, git diff --output, find -fprint — 2 на обоих. probes/gr-probe.sh: guarded-rm с
    TMPDIR вне системных временных папок — отказ, папка на месте. probes/mode-check.sh: после обновления все 414 программ
    исполняемы. git add --al и :/ — 0 (известная RT2-5); printf | dd of=.claude/hooks/… — 0 (dd заранее не разрешён).
    logs/01-*.txt
