environment: >-
  Отдельный пользователь macOS iwe-test (uid 502), запуск только через sudo -n -u iwe-test -i; каждая проба
  сверяет HOME=/Users/iwe-test и задаёт чистый PATH (через sudo протекали пути из домашней папки оператора — в
  пробах они вычищены, probes/env.sh). Пользователь ни разу не входил в систему (домена launchd gui/502 нет),
  Claude под iwe-test не вошёл (сохранённый ключ обрезан — 81 знак, ответ 401). Метка v0.42.0-rc.13 → коммит
  75b1d96c67f64c82481ad87b429f7da535967468, дерево 29bfeab0a737ea6b0e0ce73c5f95e5c282e3d657 (сверено
  git rev-parse). Установки — с заглушкой probes/gh-shim (вход изображает, любая запись в GitHub запрещена,
  чтение — анонимно). Все установки урезанные (--core): полную с расписаниями пилот решил не проверять.
  Наборы тестов — в чистом клоне метки, без заглушки gh. Между прогонами установка не удалялась, а
  переносилась в ~/iwe-rc13-macos/runs/ (probes/park.sh). Рабочую установку оператора, его launchd и его Claude
  не трогал; коммитов, отправок, меток и задач нет. В журналах имя пользователя оператора → <user>, имя машины → <host>.
  Сбой среды: на строке 4 первая попытка отката упала с «authenticated GitHub API request via gh failed» —
  исчерпан анонимный лимит GitHub API (60 в час, ответ 403); после сброса лимита шаги 4b/4c/4r повторены и прошли
  (logs/macos/line4/, row4-continuation.out). Находкой кандидата не считаю.
