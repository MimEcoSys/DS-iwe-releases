suites: >-
  Собственные наборы тестов кандидата в чистом клоне метки (дерево сверено), под iwe-test, macOS, без заглушки gh
  (probes/suites.sh): test-update-legacy-template-base — PASS; test-update-rc-channel — 10 PASS 0 FAIL;
  test-update-issue-226 — 78/0; test-update-check-verdict — 152/0; test-update-issue-1143 — 8/0;
  test-wp529-f270-core-mode-feeders, -exec-bit (406 путей), -rollback-cleanup, f261-rollback-by-installed-version,
  f270-step0-no-downgrade — PASS; guarded_rm_cases.py — 37 из 37; test-destructive-guard-find-chain — 160/0;
  hook_cases.py — все случаи. Все 13 — код 0. logs/macos/suites/
findings: >-
  М1 — НОВАЯ, только macOS: обновление ставит расписание Стратега (com.strategist.morning и
  com.strategist.weekreview в ~/Library/LaunchAgents) на урезанной установке. Воспроизведено пять раз: 0.41.11 и
  0.36.3 --core → rc.13 на обеих bash, и на 0.41.11 --core с явно записанным .iwe-install-mode = core
  (logs/macos/finding-core-strategist/: в одном выводе «Экстрактор: установка в урезанном режиме (--core) —
  расписание не заводим» и «Installing Strategist Agent launchd jobs...»). Причина в коде кандидата: в update.sh
  цикл переустановки ролей для macOS (блок role-reinstall-loop после «Роли обновлены. Переустановка...») ставит
  каждую роль с auto: true, не глядя на .iwe-install-mode; проверка режима есть только у экстрактора, а ветка Linux
  (reinstall_linux_strategist) только освежает уже существующее расписание. В 0.41.11 тот же цикл — не регрессия,
  но это тот же класс, что исправленный в 0.42 для экстрактора (RT5-2 rc.5, RT8-1 rc.8: «обновление не заводит
  расписание, которого человек не выбирал»), и обещание 0.42 для урезанной установки на macOS не выполняется.
  В первом прогоне launchctl загрузил com.strategist.morning даже без сеанса пользователя; при входе пользователя
  launchd поднимет оба задания из папки. Предложение: в цикле пропускать роли с auto: true при режиме core и при
  отсутствии файла режима без уже установленного plist (как у экстрактора); тест — расширить
  test-wp529-f270-core-mode-feeders на ветку Darwin. Решает Выпускающий: исправление или оговорка в анонсе.
  З1 — замечание: после отката на 0.41.11 повторный запуск update.sh (уже код 0.41.11) завёл расписание экстрактора
  и загрузил com.extractor.inbox-check — старое поведение 0.41.11, исправленное в 0.42; последующее обновление
  на кандидата его только освежило. Для анонса: «после отката на 0.41.11 урезанная установка может получить
  расписание разбора заметок; снять: bash scripts/setup-extractor-feeders.sh --uninstall».
  З2 — замечание: на урезанной установке обновление пишет «strategist: переустановите вручную» — совет завести
  расписание, которого человек не выбирал (следствие М1).
