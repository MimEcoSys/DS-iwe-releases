  tree: 29bfeab0a737ea6b0e0ce73c5f95e5c282e3d657
  findings: >-
    Блокирующих нет. Н1 rc.12 закрыта (см. ci_check). Атакой пройдены: чистая установка (минимальная и полная, 878
    файлов байт в байт), обновление с 0.41.11 и с 0.36.3 (нет пропавших, изменённых, без права на запуск; правки
    пользователя целы), повтор («всё актуально»), откат без подтверждения — отказ без изменений, с подтверждением — ровно
    0.41.11, возврат на rc.13 — точное совпадение (на трёх копиях), отказ при исчерпанном лимите GitHub без изменений и
    без отметки незавершённого обновления, все наборы тестов защиты из хранилища, набор опасных команд по живым хукам
    обновлённых копий 466 из 466, опись выпуска пересобирается одинаково. НОВЫЕ (низкие): Н4 — тест крайних случаев
    обновлятора в одном месте обращается к менеджеру служб без заглушки (только чтение таймеров; набор 253 из 253, но на
    машине разработчика запрос уходит к его настоящим службам); Н6 — подсказка онбординга появляется снова в сессии,
    открытой в папке шаблона: отметку о снятии ищет там, а записана она в рабочей папке. ИЗВЕСТНЫЕ: два Python-файла
    получают право запуска (оговорка); тест про изменённый хук не изолирован от gh этой машины, два теста не запускаются
    на NixOS (жёсткие пути, нет PyYAML) — известный класс (Н5 rc.9); повтор переписывает служебные отметки времени
    (оговорка). Не проверено атакой: macOS у себя (опирается на зелёные задания программы выпуска), обновление с полной
    установки (обновляла с минимальной, как и программа выпуска), включение расписаний (в песочнице нет служб).
  note: >-
    Ответ атаки сохранён вне временной папки сразу после завершения. Атака сообщила, что один тест расписания запустила
    без своей обёртки — это было внутри песочницы bwrap, реальные службы и файлы Цеха ей не видны. В журнале заглушки gh
