  решений построчно совпали с rc.9 (закрыто); f1-probe.sh — код 0, 61 строка построчно совпала с rc.9, проверка
  опасных команд та же (6c999b93) (закрыто); redteam-verify-p1.sh — код 0, решения совпали с rc.9; в конце вывода
  появился раздел пробы удаления (в rc.9 был пуст) — удаление там внутри /tmp, где оно разрешено, это не проверка
  отказа (закрыто); gr-probe.sh — код 0, папка на месте 3 из 3, контроль в /tmp удалён (закрыто); mode-check.sh —
  код 0, 414 программ, без права на запуск 0 (на rc.9 — 415: secret-bypass-analyzer.py стал 100644) (закрыто);
  rt5-1/run-drift.sh — подмена на коммит rc.8: код 2 за 4 с, «снова изменился», два перезапуска; подмена на коммит
  rc.5: код 2 за 6 с, три перезапуска (закрыто); rt5-2-core.sh — код 0, режим core, файлов службы 0, «урезанном
