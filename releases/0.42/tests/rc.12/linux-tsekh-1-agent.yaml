build: 0.42-rc.12
platform: Linux (NixOS 25.05, tsekh-1), bash 5, systemd --user, cron отсутствует
environment: >-
  Как для rc.9: отдельный пользователь Linux iwe-test (uid 1001, свой systemd --user, без доступа к домашней папке
  рабочего пользователя). Развёртывание Цеха снова удалило пользователя до начала; сторож probes/ensure-user.sh завёл
  его заново в 15:40:43 (logs/user-guard.log) и работал в фоне всё время проверки. Следы rc.9 перенесены в
  ~/rc9-archive, установки rc.12 — с нуля; папки других бесед под iwe-test (rc.10, rc.11, строки 3 и 12 rc.9) не
  трогал. Конфигурацию Цеха и рабочую установку не правил. Метка v0.42.0-rc.12 → коммит edbe1e7e758b, дерево
  8871f11de11c1904bc256449a5a479b702c122e2 (совпало с ожидаемым). Изменения rc.9 → rc.12: update.sh, guarded-rm,
  режим secret-bypass-analyzer.py (100755 → 100644), три теста обновления (новый test-update-legacy-template-base.sh),
  test-rc-upgrade-from-release.sh, две программы CI, CHANGELOG, манифест. Тесты хранилища — под iwe-test без
  ~/.local/bin в PATH (заглушка gh убрана); установки — с заглушкой probes/gh-shim (любая запись в GitHub запрещена,
  «ERROR: gh repo create failed» ожидаем; в журнале вызовов только две такие попытки). Разговоры Claude Code и пробы
  RT8-1, RT5, F3, live-permission — в песочнице bwrap с одноразовой копией установки. Обвязка песочницы (probes/B)
  исправлена в ходе проверки: обёртка из rc.9 передавала внутрь переменные окружения IWE_* оператора (путь к его
  рабочей папке; внутри песочницы папка не видна, записать туда ничего нельзя). Заметил это агент строки 10; все
  разговоры и пробы в песочнице повторены с пустым окружением, первые прогоны отброшены (logs/discarded-env-leak,
  logs/sandbox-attempt1-broken-fixture-path — там же мой промах с путём к списку меток). Результаты песочницы rc.9
  получены той же обёрткой — не перепроверял. Команды-пробы в ответ не выписывались: запускались готовые файлы из
  probes/, в отчёте имя пробы и код. В журналах имя пользователя Цеха заменено на <user>.
new_in_rc12:
  a_upgrade_from_release_by_hand: >-
    setup/test-rc-upgrade-from-release.sh из rc.12 под iwe-test (свой временный HOME, без заглушки gh):
    PREV=v0.36.3 — код 0, 399 с, «PASS: upgrade v0.36.3 -> v0.42.0-rc.12»; PREV=v0.41.11 — код 0, 144 с,
    «PASS: upgrade v0.41.11 -> v0.42.0-rc.12». В обоих: канал назвал rc.12, манифест кандидата, MISSING/DIFFERS/NOEXEC
    0 из 878, своё расширение и параметр на месте, повтор — нечего обновлять. Запуск 43221382829 «Release Candidate»
    сверен: ветка release/v0.42.0, коммит edbe1e7e (rc.12), next-rc успешно, cut пропущено, все четыре
    upgrade-from-release успешны (ubuntu и macos × v0.36.3 и latest = v0.41.11), в журналах «PASS: upgrade … ->
    v0.42.0-rc.12» и 0 из 878 по всем трём счётчикам. Но на том же коммите запуск «Validate Template» 43221329649
    (pull_request, release/v0.42.0) — validate и release-receipt failure, см. red_team.findings Н1.
    logs/1a-upgrade-from-release/
  b_builtin_tests: >-
    В чистом клоне метки (дерево сверено), под iwe-test, без заглушки gh (probes/suites-rc12.sh):
    test-update-legacy-template-base.sh — код 0, 16 из 16 проверок (L: замена недоработанной копии без конфликта;
    E: правленная копия не заменена, строка пилота на месте; M: повтор после прерванного — код 49, нет «Всё актуально»,
    файл назван, рабочий CLAUDE.md и его база не тронуты; T: отказ сохраняет код 2, строки «прервался» нет);
    test-update-rc-channel.sh — код 0, 10 PASS 0 FAIL; он же с заглушкой gh, которая отвечает «Logged in», в PATH —
    код 0, 10 из 10 (Н5 закрыта); test-update-issue-226.sh — код 0, 78 PASS 0 FAIL; test-update-check-verdict.sh —
    код 0, 152 PASS 0 FAIL; guarded_rm_cases.py — «37 из 37 как ожидалось» на NixOS без подмены пути к rm (RT8-2 / Н1
    закрыта; guarded-rm теперь ищет rm только в /usr/bin, /bin и /run/current-system/sw/bin). logs/suites/
  c_rt8_3: >-
    Штатные отказы на установке rc.12 (probes/row4.sh): канал main с --yes — код 1, файлы не изменены; обычный
    update.sh с ответом y и канал main без --yes — код 0, файлы не изменены, просит ROLLBACK. Строк «прервался на
    строке» в журналах строки 4 — 0 (на rc.9 после отказа была лишняя «ОШИБКА: update.sh прервался на строке 1»).
    Во всех журналах установок две такие строки — обе цитата из списка изменений rc.12, не сообщение. Тест T из
    legacy-template-base — то же на отказе из-за сбоя загрузки. RT8-3 закрыта. logs/test-user/04*
closed_earlier_still_closed: >-
  Встроенные наборы в чистом клоне rc.12: test-destructive-guard-find-chain.sh — PASS=160 FAIL=0, hook_cases.py —
