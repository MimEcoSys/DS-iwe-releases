red_team:
  verdict: BLOCKED
  accepted_by: ""
  checker: tsekh-1-agent (отдельный разговор Claude Code, Opus 5.5, без истории этой работы; запрос дословно из задания; 2056 с; песочница bwrap с копией чистой установки rc.12, пустое окружение)
  report: redteam-linux.md (ответ атаки дословно + сверка тестировщика; полный журнал — logs/line13/)
  tree: 8871f11de11c1904bc256449a5a479b702c122e2
  findings: >-
    Н1 — НОВАЯ, блокирующая: на коммите edbe1e7e проверки validate и release-receipt запуска «Validate Template»
    43221329649 — failure (на rc.9 обе success). Журнал задания: «Result: 189 PASS, 3 FAIL», упал
    test_issue_541_workspace_base.sh — случай 5 (старая раскладка с базой в папке шаблона: нет 3-way merge копии
    шаблона) и случай 11 (сломанный git при старой раскладке: копия CLAUDE.md в папке шаблона изменена и её база
    сдвинута, хотя обновление сообщает о сбое). Оба — предмет правки rc.12. Атака журнал прочитать не смогла (нужны
    права администратора), тестировщик прочитал и подтвердил. Локально на NixOS тот же тест падает массово из-за
    подмены mktemp — с сервером не сравнимо. Н2 — ИЗВЕСТНЫЙ класс (права на запуск): после отката и возврата
    scripts/artifactor.py и scripts/check-manifest-coverage.py исполняемы, в git 0644; в оговорке названы другие
    три *.sh. Н3 — НОВАЯ, замечание: ответ «нет» на вопрос об откате даёт код 0, файлы не трогаются. Около 15 тестов
    хранилища не работают на NixOS — известный класс (Н5 rc.9). Атакой пройдены: калибровка, чистая установка
    (878 файлов), обновление с 0.41.11 и с 0.36.3, повтор, откат без согласия и с ответом «нет» (без изменений), с
    ROLLBACK (ровно 0.41.11, правки целы), возврат на rc.12, 25 наборов тестов защиты, разрешения агента без
    свободного запуска команд. Не проверено атакой: macOS у себя (опирается на зелёные задания программы выпуска).
  note: "Ответ атаки сохранён вне временной папки сразу после завершения. Вызовов gh на запись нет, задач атака не заводила (создание задач на машине запрещено)."
not_checked:
  - "Строки 3, 5-8, 11, 12, 14-17 — вне задания (строку 3 своими руками закрывает new_in_rc12.a_upgrade_from_release_by_hand)."
  - "RT5-5 (поиск кандидата по страницам) — готового файла пробы нет, в список задания не входил."
  - "Настоящий systemd в песочнице: systemctl и crontab в RT8-1/RT5-2 подменены записью вызовов; настоящие таймеры — только на чистой установке строки 9."
  - "Полная установка с входом в gh и Claude: gh заменён запретом записи, создание хранилища отказывает, остальное проходит."
  - "macOS и Windows — только задания программы выпуска на сервере (macOS обновление из 0.36.3 и 0.41.11 — успешно)."
  - "Результаты песочницы на rc.9 получены обёрткой с протечкой переменных окружения — не перепроверял."
release_readiness: >-
  rc.12 тестировщикам не отдавать: всё новое в rc.12 на Linux работает (обновление 0.36.3 и 0.41.11, тест установки
  0.36 16/16, RT8-2, RT8-3, Н5 закрыты; строки 1, 2, 4, 9, 10, 18 пройдены, закрытое осталось закрытым), но на коммите
  кандидата красная обязательная проверка «Validate Template» (test_issue_541_workspace_base.sh, случаи 5 и 11 — про
  ту же копию CLAUDE.md, которую правил rc.12), и атака дала BLOCKED. Нужен разбор упавших случаев и новый кандидат.
