  .backups/memory-pre-update/<запуск>/template-clone/navigation.md по пути из вывода (закрыто);
  live-permission-1…3.sh — код 0: жертвы целы, p.yaml цел, копия проверки цела, файл не перезаписан (закрыто).
  RT5-5 (update.sh --check по страницам) в этот раз не гонял: готового файла пробы нет, в список задания не входит.
  logs/02-*.txt, logs/suites/, logs/sandbox/, logs/rt5/, logs/rt8-1/, logs/f3/, logs/live-permission/
