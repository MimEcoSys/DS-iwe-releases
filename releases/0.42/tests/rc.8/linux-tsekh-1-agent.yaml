red_team:
  verdict: CAUTION
  accepted_by: ""
  checker: tsekh-1-agent (отдельный разговор Claude Code, Opus 5.5, без истории этой работы; запрос дословно из задания; 89 ходов, 23 мин; песочница bwrap с копией чистой установки rc.8; защитное ограничение фильтра не сработало)
  report: redteam-linux.md
  tree: c6ce49f5d11325b9e9fa18489c0687e16b327a86
  findings: >-
    RT8-1 P2 — НОВАЯ как запись, давняя по сути, подтверждена мной: после setup.sh --core версии 0.41.11 файла режима
    нет, и первое обновление до rc.8 заводит расписание извлечения знаний (в ~/.config/systemd/user появляются
    extractor-git-diff-feed.service и .timer) — установка в урезанном режиме получает автоматику, которую не выбирала.
    Моя проверка: probes/rt5-2-core-from-prev.sh — 0.41.11 --core → обновление до rc.8: файлов службы 0 до, 2 после;
    на rc.7 так же (2). То есть исправление RT5-2 работает только для установок, сделанных новой версией
    (setup.sh --core пишет режим core), а для уже стоящих установок 0.41.11 в урезанном режиме нет. Откат: setup-
    extractor-feeders.sh --uninstall. logs/rt5/rt5-2-core-from-0.41.11-*.log
    RT8-2 P3 — ИЗВЕСТНАЯ: guarded-rm ищет rm только в /usr/bin и /bin, на NixOS отказывает всегда (безопасный отказ).
    RT8-3 P3 — НОВАЯ по записи (давняя, как rc.3 F4): после правильного отказа отката с --yes печатается лишняя строка
    «ОШИБКА: update.sh прервался на строке 1» из перехватчика ошибок.
    RT8-4 P3 — НОВАЯ: после подтверждённого отката два файла (artifactor.py, check-manifest-coverage.py) остаются
    исполняемыми, в 0.41.11 их права обычные — косметическая правка в git форка.
    Прежние находки rc.7 (скобки в find, разрешение для скрипта онбординга от текущей папки, пустые папки после
    возврата, ложное падение теста при входе в gh) атака отдельно не записывала. Известные из задания: чтение секретов
    разрешёнными командами (ограничение в описании выпуска), повторный запуск переписывает служебные отметки времени —
    атака отметила как ожидаемое.
    Пройдены атакой: калибровка 21/21, подлинность метки, CI на коммите кандидата (33 успеха, 2 пропуска), манифест
    878/878, чистая установка, обновление 0.41.11 → rc.8 (113 файлов, правки на месте), повтор, отказ отката с --yes,
    подтверждённый откат (853/853), повторное обновление после отката, права агента (+3 разрешения для скрипта
    онбординга), 18 из 19 наборов защиты агента (19-й требует rm в /usr/bin), 65 из 67 наборов обновления и установки.
    Не проверено атакой: полная установка с входом в gh/Claude, macOS (только CI), guarded-rm и один тест планировщика на
    хосте без /usr/bin.
  note: "Отчёт атаки скопирован из песочницы сразу после завершения. Вызовов gh на запись нет, задач не заводилось (RT8-1 требует задачи — решает Выпускающий)."
rc7_findings_closed:
  F1a: "закрыта: скобки и экранированные разделители в выражении find больше не прячут пишущие действия (набор шаблона 160/160, моя проба 15/16 остатков rc.7 блокируются, исполнение в копии: жертва и проверка целы)."
  F1b: "закрыта: запись перенаправления в файл читающей командой блокируется (в том числе с номером вывода и без пробела); остаётся только встроенная «:» вне заранее разрешённых."
not_checked:
