  - "Режим без запросов разрешения с живым агентом: проверка команд оценена запуском её наборов и моей пробой (проверка решения и исполнение в копии), не живым агентом."
  - "Содержимое запрещённых для выписывания списков атакующих команд в отчёт не вынесено по условию задания: в отчёте только имя пробы, код и счёт."
  - "RT5-1 с двумя версиями под защитой: сервер не отдаёт согласованной пары, заглушка даёт только подмену снимка; завершение без цикла подтверждено, содержимое доставки под подменой не оценивалось."
  - "macOS и Windows, включение служб (атака видела только зелёные задания на сервере)."
