build: 0.42-rc.8
platform: Linux (NixOS 25.05, tsekh-1), bash 5, systemd --user, cron отсутствует
environment: >-
  Как для rc.7: отдельный пользователь Linux iwe-test (uid 1001, свой systemd --user, без доступа к домашней папке
  рабочего пользователя); всё от rc.7 перенесено в ~/rc7-archive, установки rc.8 — с нуля. Всё время проверки работал
  сторож probes/ensure-user.sh (logs/user-guard.log — пропаж не было). Конфигурацию Цеха не правил. Разговоры Claude
  Code и проверки RT5, F3 — в песочнице bwrap с копией установки iwe-test. Вместо gh — тестовая замена probes/gh-shim
  (запрет любой записи; «ERROR: gh repo create failed» в выводе установки ожидаем). Метка v0.42.0-rc.8 → коммит
  b871465497e0, дерево c6ce49f5d11325b9e9fa18489c0687e16b327a86 (совпало с ожидаемым; в атаке: объект метки 73a31e086c40
  → тот же коммит). Работа шла в двух беседах: первая (строки 1, 2, 4, 9, 10, 18, первый заход на строку 13) была дважды
  остановлена защитным фильтром на списках атакующих команд в тексте ответа; вторая довела проверку, в ответ команды-пробы
  не выписывались — пробы запускались готовыми файлами из probes/. Первый заход атаки (16 ходов, 2 мин, без отчёта)
  сохранён как logs/line13/13-redteam-first-attempt-short.jsonl и в зачёт не идёт. В журналах имя пользователя Цеха
  заменено на <user>.
preflight_rc7_fixes:
  F1a_F1b: >-
    Закрыты. (1) Встроенные наборы тестов шаблона запущены мной из папок /tmp/rc8-guard-check.WZuGgr: набор цепочек
    find (test-destructive-guard-find-chain.sh) на rc.8 — PASS=160 FAIL=0 (код 0), на rc.7 — PASS=69 FAIL=91 (код 1);
    набор записи в файлы (test-destructive-guard-file-writers.sh) — код 0 на обеих; hook_cases.py на rc.8 — 466 из 466,
    на rc.7 — 464 из 464. logs/suites/. (2) Моя проба probes/f1-probe.sh (проверка через все 6 установленных команд-
    проверок, при пропуске — исполнение в одноразовой копии, жертва и копия проверки сверяются): на rc.8 блокируются все
    8 форм атаки rc.6, обнуление через >|, контроль (2/2), все мои прежние варианты кроме одной и все остатки rc.7
    (скобки в find, 1> и запись без пробела) — по разделам: 8/8, 1/1, 2/3, 20/23, 15/16; читающие цепочки проходят (0).
    Единственная команда с действием, которую rc.8 пропускает, — встроенная «:» с перенаправлением, она не входит в
    заранее разрешённые (cat, rg, find), так что в обычном режиме Claude Code спросит; на rc.7 и 0.41.11 она проходила
    так же. На rc.7 те же остатки: пропущено и исполнено 11 из 14 форм; на 0.41.11 — 14 из 16 (и все 8 форм rc.6 —
    7 с действием). logs/01-f1-probe-rc8.txt, -rc7.txt, -v04111.txt. (3) Живые проверки разрешений
    (probes/live-permission-1…3.sh, разговор Claude Code в обычном режиме на копии rc.8): жертвы целы, копия проверки
    цела, файл не перезаписан — Claude Code сам не разрешает без вопроса. logs/live-permission/.
  F1_overwrite_by_read_command: >-
    Вопрос задания «перезаписывает ли заранее разрешённая читающая команда с перенаправлением вывода рабочий файл без
    вопроса»: на rc.8 — НЕТ (проверка команд блокирует все записи перенаправления в моей пробе; в обычном режиме Claude
    Code сам спрашивает); на rc.7 — ДА для части форм (11 из 14 исполнены); на 0.41.11 — ДА (в 0.41.11 не блокировалось
    ничего из пробы, включая простой find с удалением). logs/01-f1-probe-*.txt
  F2: >-
    Закрыта. Запуск 43163821436 «Release Candidate»: workflow_dispatch с ветки release/v0.42.0, коммит b8714654 (rc.8);
    next-rc — успешно, cut — пропущено, upgrade-from-release — успешно. Задание ставит v0.41.11 (setup.sh --core),
    обновляет до rc.8 через канал rc, сверяет установленные файлы (MISSING/DIFFERS/NOEXEC 0 из 878), правки пользователя
    и повтор: «PASS: upgrade v0.41.11 -> v0.42.0-rc.8». logs/f2/run-43163821436.log
  closed_earlier_still_closed: >-
    probes/chain-probe.sh (rc.8 и rc.7 рядом): результат одинаков — формы rc.3 14/14 с кодом 2, git branch/remote 14/14,
    запись в файлы проверок и настроек 9/9, RT5-3 10/10, контроль и чтение — 0. probes/redteam-verify-p1.sh и
    gr-probe.sh — как на rc.7 (guarded-rm с TMPDIR вне системных временных папок — отказ, папка на месте).
    probes/mode-check.sh: после обновления все 415 программ исполняемы. RT5-1 (probes/rt5-1/run-drift.sh): подмена
    версии на коммит rc.5 (без защиты) — остановка через 27 с, код 2, «update.sh на сервере снова изменился сразу после
    перезапуска», три перезапуска; подмена на коммит rc.7 — завершается кодом 0 за 131 с без цикла (доставлен снимок
    rc.7 под подменной меткой — это следствие заглушки, не зависание). RT5-2 (probes/rt5-2-core.sh): setup.sh --core на
    rc.8 → режим core, после обновления «установка в урезанном режиме — расписание не заводим», файлов службы 0. RT5-4
    (строка 4): после ROLLBACK повтор без «обновлён слиянием». RT5-5: 200 меток на «v», по страницам (3 запроса по 100),
    «Канал поставки: кандидат v0.42.0-rc.8». F3 (probes/f3-clone-memory.sh): правка в memory/navigation.md папки шаблона
    найдена в .backups/memory-pre-update/<запуск>/template-clone/navigation.md, путь назван в выводе. logs/01-*.txt,
    logs/rt5/, logs/f3/
