# Файл Разработчика: подготовка правок «Ещё не выпущено» к передаче Выпускающему.
# Правит только команда iwe-developers через запрос на слияние. Ключ — ключ записи с табло (U-…).
# Черновик 28.11.2026, ИИ-агент Разработчика, по истории основной ветки шаблона (git log --first-parent v0.42.2..origin/main,
# вершина ca0d6af7 — после слияния пяти возможностей и пяти исправлений 0.43) и записям «Ещё не выпущено» на ней
# (32 записи, 29 слияний); проверяет Разработчик.
# Из этого файла программа собирает releases/<release>/candidates.md. Поля «как проверить» и «как откатить»
# переносятся в записи CHANGELOG.md на ветке выпуска до первой сборки.
#   rollback_unit   слияние в основной ветке, которое добавило запись; записи с одним слиянием откатываются вместе;
#                   «(прямой коммит)» — запрос влит одним коммитом без коммита слияния
#   groups          слияния с несколькими записями: separable да|нет — можно ли снять одну запись без остальных
#   commits         коммиты правки от нового к старому; из них программа строит указание «как откатить»
#   off_switch      (необязательно) как выключить правку без отката
#   revert_first    (необязательно) записи, которые нужно откатить раньше этой, иначе откат конфликтует в коде
#   risk            высокий | средний | низкий, затем причина
#   recommendation  взять | отложить | решить Выпускающему, затем причина
#   depends_on      другие записи, с которыми правка делит файлы или от которых зависит
# Состав 0.43 решён Выпускающим 27.11.2026 (decisions.md): пять возможностей голосования, всё влитое после 0.42.2, пять
# обещанных исправлений; ключи записей Выпускающий называет при нарезке по странице candidates.md. Откат любой записи
# почти всегда конфликтует в CHANGELOG.md и update-manifest.json; кроме них конфликтуют списки шагов в
# .github/workflows/validate-template.yml и строки в scripts/tests/run-issue-tests.sh (оставить обе стороны). Остальные
# конфликты откатов проверены пробным откатом каждого слияния на снимке ca0d6af7 и записаны в revert_first.
