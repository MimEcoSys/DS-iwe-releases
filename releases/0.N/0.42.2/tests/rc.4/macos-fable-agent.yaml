  update-manifest.json; update.sh, setup.sh и остальное не менялись. На rc.4 запускалась одна установка: чистая,
  полная (setup.sh без --core), неинтерактивно (SETUP_CI=1), с Python-окружением из requirements.txt; на ней же
  шли все запуски строк 4 и 5. Обновление с 0.42.1 на rc.4 не запускалось. Установка — в пустой временной папке,
  окружение очищено (env -i), HOME одноразовый. gh, launchctl и crontab подменены заглушками (probes/stub-*.sh):
  gh отказывает во всём, кроме анонимного клонирования трёх открытых базовых репозиториев; настоящие службы,
  расписание, хранилища GitHub и настройки пользователя не менялись. Строки 4 и 5 пройдены живым агентом
  Claude Code 2.1.329 в неинтерактивном режиме (claude -p, модель Sonnet 5.5, вход по отдельному токену
  тестировщика, который читался только в окружение процесса агента): запуск из одноразового HOME, рабочая папка
  помечена доверенной в одноразовом .claude.json (как после согласия человека в диалоге доверия), перед запуском
  прочитан ~/.zshenv установки (как при запуске из терминала), системные настройки git отключены. В таком режиме
  запрос подтверждения некому принять: он отклоняется сам и виден в ответе инструмента («Claude requested
  permissions…»); сам диалог подтверждения на экране не наблюдался. В запусках строки 4 команды оболочки
  разрешены заранее (--allowedTools Bash — как если бы человек подтверждал запросы на команды), чтобы отказ мог
  прийти только от защитных проверок установки; запуски строки 5 — без этого флага. Kimi Code не проверялся.
  Журналы — logs/macos/ (у живых запусков — сжатая стенограмма: вызовы инструментов, ответы, слова агента),
  проверочные скрипты и тексты поручений агенту — probes/; пути заменены на <TMP>.
