platform: macOS 26.7.1 (Darwin arm64), одноразовые папки и одноразовый HOME; системный bash 3.2, git из /usr/bin, python3 из Homebrew
environment: >-
  Проверка 25.11.2026, ИИ-агент Fable в отдельной беседе без истории правок выпуска (не автор кода).
  Метка v0.42.2-rc.3 = коммит 1c4a0720c51c4e388da6af3474bd540a9e156b59, дерево 55a710210dc9e4f95e571fd20f832033c1e78b0a.
  Все строки пройдены заново, отметки rc.2 не переносились. Каждая установка — в своей пустой временной папке,
  окружение очищено (env -i), HOME одноразовый. gh, launchctl и crontab подменены заглушками (probes/stub-*.sh):
  gh отказывает во всём, кроме анонимного клонирования трёх открытых базовых репозиториев; настоящие службы,
  расписание, хранилища GitHub и настройки пользователя не менялись. Установка — полная (setup.sh без --core),
  неинтерактивно (SETUP_CI=1). Строки 4 и 5 пройдены живым агентом Claude Code 2.1.329 в неинтерактивном режиме
  (claude -p, модель Sonnet 5.5, вход по отдельному токену тестировщика, который читался только в окружение
  процесса агента): запуск из одноразового HOME, рабочая папка помечена доверенной в одноразовом .claude.json
  (как после согласия человека в диалоге доверия), перед запуском прочитан ~/.zshenv установки (как при запуске из
  терминала), системные настройки git отключены. В таком режиме запрос подтверждения некому принять: он
  отклоняется сам и виден в ответе инструмента («Claude requested permissions…»); сам диалог подтверждения на
  экране не наблюдался. Отличие от rc.2: в запусках строки 4, начиная со второго, команды оболочки разрешены
  заранее (--allowedTools Bash — как если бы человек подтверждал запросы на команды), чтобы отказ мог прийти
  только от защитных проверок установки, а не от запроса разрешения; запуски строки 5 — без этого флага.
  Kimi Code не проверялся. Журналы — logs/macos/ (у живых запусков — сжатая стенограмма: вызовы инструментов,
  ответы, слова агента), проверочные скрипты и тексты поручений агенту — probes/; пути заменены на <TMP>.
