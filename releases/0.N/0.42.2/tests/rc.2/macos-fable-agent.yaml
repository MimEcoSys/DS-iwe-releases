  отклоняется сам и виден в ответе инструмента («Claude requested permissions…»); сам диалог подтверждения на
  экране не наблюдался. Kimi Code не проверялся. Журналы — logs/macos/ (у живых запусков — сжатая стенограмма:
  вызовы инструментов, ответы, слова агента), проверочные скрипты — probes/; пути заменены на <TMP>.
